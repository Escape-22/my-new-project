<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>뫼비우스 반전 자기점검</title>

<style>
:root {
  --bg: #f6f1e6;
  --surface: #fffdf8;
  --ink: #1a2b4a;
  --ink-soft: #4b5872;
  --teal: #1f7e79;
  --teal-deep: #17615d;
  --teal-soft: #dcefec;
  --on-teal: #fffdf8;
  --gold: #b58a2b;
  --line: #d8cfb8;
  --warn: #a63a4d;
  --warn-soft: #f7e4e6;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a2c;
    --surface: #16243a;
    --ink: #f0ead8;
    --ink-soft: #b7bfcf;
    --teal: #56b8b0;
    --teal-deep: #7fd0c8;
    --teal-soft: #1b3a44;
    --on-teal: #0f1a2c;
    --gold: #d8b45c;
    --line: #2b3b55;
    --warn: #e58a98;
    --warn-soft: #3a2029;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a2c;
  --surface: #16243a;
  --ink: #f0ead8;
  --ink-soft: #b7bfcf;
  --teal: #56b8b0;
  --teal-deep: #7fd0c8;
  --teal-soft: #1b3a44;
  --on-teal: #0f1a2c;
  --gold: #d8b45c;
  --line: #2b3b55;
  --warn: #e58a98;
  --warn-soft: #3a2029;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Apple SD Gothic Neo", "AppleSDGothicNeo", "Noto Sans KR", "Malgun Gothic", "Nanum Gothic", system-ui, sans-serif;
  font-size: 1.125rem;
  line-height: 1.85;
  text-align: left;
  -webkit-text-size-adjust: 100%;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.wrap {
  max-width: 40rem;
  margin: 0 auto;
  padding: 1.25rem calc(1.1rem + env(safe-area-inset-right, 0px)) 4rem calc(1.1rem + env(safe-area-inset-left, 0px));
}
h1, h2, h3, h4 { margin: 0; line-height: 1.35; color: var(--ink); }
h1 { font-size: clamp(2rem, 8vw, 2.6rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.6rem, 6vw, 2rem); font-weight: 700; }
h3 { font-size: 1.3rem; font-weight: 700; }
h4 { font-size: 1.1rem; font-weight: 700; color: var(--teal-deep); margin: 1.3rem 0 .2rem; }
p { margin: .6rem 0; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#focus:focus { outline: none; }

.hero { text-align: left; padding: .5rem 0 1rem; }
.hero .lem { display: block; width: 100%; height: auto; margin: 0 0 1rem; }
.lede { font-size: 1.15rem; color: var(--ink-soft); margin: .8rem 0 0; }
.small { font-size: 1.0625rem; color: var(--ink-soft); }

.lem path { fill: none; stroke: var(--line); stroke-width: 2.2; }
.lem .node circle { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.lem .node text { fill: var(--ink-soft); font-size: 17px; font-family: "Times New Roman", "Noto Serif Hebrew", "Arial Hebrew", serif; }
.lem .node.done circle { fill: var(--teal); stroke: var(--teal); }
.lem .node.done text { fill: var(--on-teal); }
.lem .node.now circle { stroke: var(--gold); stroke-width: 3.5; }
.lem .node.now text { fill: var(--ink); }
.lem .node.l1 circle { fill: var(--teal); fill-opacity: .14; stroke: var(--teal); }
.lem .node.l2 circle { fill: var(--teal); fill-opacity: .38; stroke: var(--teal); }
.lem .node.l3 circle { fill: var(--teal); fill-opacity: .72; stroke: var(--teal); }
.lem .node.l4 circle { fill: var(--teal); fill-opacity: 1; stroke: var(--teal); }
.lem .node.l1 text, .lem .node.l2 text { fill: var(--ink); }
.lem .node.l3 text, .lem .node.l4 text { fill: var(--on-teal); }

.prog { margin-bottom: .6rem; }
.prog .lem { display: block; width: 100%; max-width: 22rem; height: auto; margin: 0 auto; }
.progtxt { text-align: center; margin: .2rem 0 0; color: var(--ink-soft); font-size: 1.0625rem; }

.card {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 1.1rem 1.15rem;
  margin: 1rem 0;
}
.card > label, .codebox > label { display: block; font-weight: 700; margin-bottom: .35rem; }
.codecard > summary, .adm > summary, .body > summary { cursor: pointer; font-weight: 700; font-size: 1.15rem; }
.codecard > summary::marker, .adm > summary::marker, .body > summary::marker { color: var(--teal); }

input[type="text"], textarea {
  width: 100%;
  font: inherit;
  font-size: 1.125rem;
  color: var(--ink);
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: .75rem .85rem;
}
textarea { line-height: 1.6; margin-top: .7rem; resize: vertical; }
.row { display: flex; gap: .6rem; }
.row input { flex: 1; min-width: 0; }

.btn {
  font: inherit;
  font-size: 1.125rem;
  font-weight: 700;
  min-height: 3.2rem;
  padding: .55rem 1.3rem;
  border-radius: 12px;
  border: 1.5px solid var(--teal);
  background: var(--teal);
  color: var(--on-teal);
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--teal-deep); }
.btn.wide { display: block; width: 100%; margin-top: .7rem; }
.msg { min-height: 1.5rem; margin: .5rem 0 0; color: var(--ink-soft); font-size: 1.0625rem; }
.savetxt { min-height: 1.4rem; margin: .8rem 0 0; color: var(--ink-soft); font-size: 1rem; text-align: right; }
.demo { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: .6rem .9rem; font-weight: 700; font-size: 1rem; margin: 0 0 .8rem; }
.ok { color: var(--teal-deep); font-weight: 700; margin: .8rem 0; }
.err { color: var(--warn); font-weight: 700; min-height: 1.5rem; margin: 1rem 0 0; }

.stagehead { margin: 1rem 0 1.4rem; }
.qsubtitle { font-size: 1.15rem; color: var(--teal-deep); font-weight: 500; margin: .6rem 0 0; }
.intro {
  background: var(--teal-soft);
  border-left: 4px solid var(--teal);
  border-radius: 4px 12px 12px 4px;
  padding: .5rem 1rem;
  margin-top: 1rem;
}
.intro p { margin: .55rem 0; }

.item {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 1.1rem 1.05rem 1.2rem;
  margin: 1rem 0;
}
.item.missing, .part.missing { border-color: var(--warn); background: var(--warn-soft); }
.part.missing { border-radius: 10px; border-width: 1.5px; border-style: solid; padding: .5rem; }
.qhead { display: flex; gap: .8rem; align-items: flex-start; }
.qn {
  flex: none;
  width: 2.2rem; height: 2.2rem;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin-top: .15rem;
}
.qsub { margin: 0; font-weight: 700; color: var(--teal-deep); }
.qstem { margin: 0; font-size: 1.2rem; font-weight: 500; line-height: 1.7; }
.pstem { margin-top: 1rem; }
.pl { display: inline-block; margin-right: .5rem; font-weight: 700; color: var(--teal-deep); }
.opts { margin-top: .5rem; }
.opt {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: .7rem;
  padding: .9rem 1rem;
  margin-top: .6rem;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
  cursor: pointer;
}
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:focus-within { outline: 3px solid var(--gold); outline-offset: 2px; }
.opt.sel { border-color: var(--teal); background: var(--teal-soft); box-shadow: inset 0 0 0 1px var(--teal); }
.mark { flex: none; width: 1.5rem; font-size: 1.3rem; line-height: 1.5; color: var(--teal); }
.txt { flex: 1; line-height: 1.7; }

.nav { display: flex; justify-content: space-between; gap: .8rem; margin-top: 1.4rem; }
.nav .btn { flex: 1; }

.res {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 1.1rem 1.15rem;
  margin: 1rem 0;
}
.reshead { display: flex; gap: .9rem; align-items: flex-start; }
.glyph {
  flex: none;
  width: 2.6rem; height: 2.6rem;
  border-radius: 50%;
  border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; line-height: 1;
  font-family: "Times New Roman", "Noto Serif Hebrew", "Arial Hebrew", serif;
  color: var(--ink);
}
.lvline { margin: .4rem 0 0; font-size: 1.15rem; }
.chip {
  display: inline-block;
  margin-right: .5rem;
  padding: 0 .55rem;
  border-radius: 999px;
  background: var(--teal);
  color: var(--on-teal);
  font-weight: 700;
  font-size: 1.05rem;
}
.meter { display: flex; gap: 4px; margin: .8rem 0 .2rem; }
.meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.meter i.on { background: var(--teal); }
.body { margin-top: .9rem; border-top: 1px solid var(--line); padding-top: .8rem; }
.say {
  border-left: 4px solid var(--teal);
  padding: .2rem 0 .2rem .9rem;
  color: var(--teal-deep);
  font-weight: 500;
}
.lvblock { border-top: 1px solid var(--line); margin-top: 1.1rem; padding-top: 1rem; }
.lvblock:first-of-type { border-top: 0; margin-top: .8rem; }
.adm { padding: 1rem 1.15rem; }
.snote { margin: .3rem 0 0; color: var(--ink-soft); font-size: 1.0625rem; }
.fbq { border-top: 1px solid var(--line); margin-top: 1.2rem; padding-top: 1rem; }
.fbq:first-of-type { border-top: 0; margin-top: .4rem; padding-top: .2rem; }
.fbq h4 { margin-top: 0; font-size: 1.2rem; }
.fbstem { color: var(--ink-soft); margin: .4rem 0 .6rem; }
.myans { display: block; background: var(--teal-soft); border-radius: 10px; padding: .6rem .85rem; margin: .6rem 0 .8rem; line-height: 1.7; }
.myans .mylab { display: block; font-size: 1rem; font-weight: 700; color: var(--teal-deep); }
.myans .mark { display: inline; width: auto; font-size: 1.15rem; }
.fbst { font-weight: 700; color: var(--teal-deep); margin: .6rem 0 .2rem; }
.tools .btn.wide { margin-top: .7rem; }

@media (max-width: 30rem) {
  .row { flex-direction: column; }
  .nav .btn { padding-left: .6rem; padding-right: .6rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .btn { transition: background-color .12s ease, border-color .12s ease; }
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>

 필요한 것은 무너지기 전에 내 몸과 마음의 작은 신호를 알아차리고, 나만의 쉼을 마련하는 연습입니다."], ["당신은 몸의 이상이 뚜렷해지거나 주변 사람이 걱정해야 자신이 지쳤다는 것을 실감한다고 응답하셨습니다. 이렇게 되면 스스로 피로를 알아차리기보다 몸의 이상이나 다른 사람의 말을 통해서야 자신의 상태를 확인하게 될 수 있습니다. 그때는 이미 충분히 쉬어야 할 만큼 피로가 쌓여 있을 가능성이 있습니다. 그러다 보면 나만의 쉼을 미리 마련하기보다 지친 뒤에야 겨우 쉬게 될 수 있습니다. 내 상태를 다른 사람이 알려주기 전에 스스로 알아차리고, 필요한 쉼을 마련하는 연습이 필요합니다."], ["당신은 피로와 감정의 변화를 비교적 일찍 느끼고 자신의 상태를 살피기 시작한다고 응답하셨습니다. 이렇게 자신의 변화를 일찍 알아차릴 수 있으면 피로가 깊어지기 전에 필요한 쉼을 생각하고, 나만의 시간과 공간을 마련할 수 있습니다. 몸과 마음의 신호를 살피면서 무리하고 있는 부분을 조정할 수도 있습니다. 이미 자신의 상태를 살피고 조절하려는 힘을 가지고 있다는 점이 좋습니다. 이 힘을 계속 키워가면 지친 뒤에야 쉬는 것이 아니라, 지치기 전에 자신을 돌볼 수 있습니다."], ["당신은 작은 변화가 생길 때부터 자신의 몸과 마음의 상태를 살피며 필요한 조절을 한다고 응답하셨습니다. 이렇게 자신의 작은 변화까지 알아차릴 수 있으면 피로가 깊어지기 전에 필요한 쉼과 조절을 선택할 수 있습니다. 나만의 쉼의 시간과 공간도 특별히 지쳐야만 마련하는 것이 아니라, 자신을 돌보기 위해 의식적으로 지켜갈 수 있습니다. 자신의 상태를 세심하게 살피고 필요한 때에 조절할 수 있는 힘은 소중한 자산입니다. 지금처럼 자신의 신호에 귀 기울이며 자신을 돌보는 시간을 지켜가십시오."]]}, {"sub": null, "stem": "다른 사람의 요구가 계속되는 상황입니다. 나는 내게 필요한 것과 지켜야 할 경계를 어떻게 다룹니까?", "opts": ["다른 사람의 요구를 거절하기 어려워 내 필요를 뒤로 미루는 일이 반복된다.", "내게 무리가 되는 것을 알면서도 상대의 상황이나 필요를 먼저 생각하게 된다.", "다른 사람의 요구와 내게 필요한 것을 함께 살피면서 조정할 수 있다.", "상대의 필요를 존중하면서도 내가 감당할 수 있는 범위와 지켜야 할 선을 분명하게 정할 수 있다."], "fb": [["당신은 다른 사람의 요구를 거절하기 어려워 자신의 필요를 뒤로 미루는 일이 반복된다고 응답하셨습니다. 이렇게 되면 다른 사람의 요구가 생길 때마다 나만의 쉼이나 필요한 시간을 먼저 내어주게 될 수 있습니다. 자신의 상태를 충분히 살피기도 전에 상대의 필요를 받아들이게 되면, 정작 자신에게 필요한 쉼의 공간을 마련하기 어려워집니다. 그러다 보면 쉬어야 할 때에도 계속해서 다른 사람의 요구를 감당하게 되고, 피로가 누적될 수 있습니다. 지금 필요한 것은 모든 요구를 거절하는 것이 아니라, 다른 사람을 돕기 전에 나에게도 필요한 것이 있다는 사실을 함께 살피는 연습입니다."], ["당신은 자신에게 무리가 된다는 것을 알면서도 상대의 상황이나 필요를 먼저 생각하게 된다고 응답하셨습니다. 이렇게 되면 자신의 한계를 알고 있으면서도 다른 사람의 필요를 우선하다 보니, 나만의 쉼과 회복을 위한 시간과 공간을 계속 뒤로 미루게 될 수 있습니다. 상대를 배려하는 마음은 있지만, 그 과정에서 자신의 필요를 지나치게 희생하게 되면 결국 자신을 돌볼 여유가 줄어들 수 있습니다. 지금 필요한 것은 다른 사람의 필요를 외면하는 것이 아니라, 상대의 필요와 나의 한계를 함께 살피면서 내가 감당할 수 있는 범위를 정하는 연습입니다."], ["당신은 다른 사람의 요구와 자신의 필요를 함께 살피면서 조정할 수 있다고 응답하셨습니다. 이렇게 되면 상대의 요구가 생기더라도 자신의 필요를 무조건 뒤로 미루지 않고, 상황에 따라 쉼과 도움의 시간을 조정할 수 있습니다. 다른 사람을 배려하면서도 자신에게 필요한 시간과 공간을 함께 지킬 수 있기 때문에, 한쪽의 요구만을 따라가느라 자신을 소진시키는 일을 줄일 수 있습니다. 자신의 필요와 다른 사람의 필요를 함께 바라보고 조정할 수 있다는 것은 건강한 균형을 만들어가는 중요한 힘입니다."], ["당신은 상대의 필요를 존중하면서도 자신이 감당할 수 있는 범위와 지켜야 할 선을 분명하게 정할 수 있다고 응답하셨습니다. 이렇게 되면 다른 사람의 요구가 계속되더라도 자신의 쉼과 회복을 위한 공간을 쉽게 내어주지 않고, 필요한 경우 분명하게 자신의 한계를 알릴 수 있습니다. 상대를 배려하면서도 자신의 시간과 에너지를 스스로 조절할 수 있기 때문에, 다른 사람의 필요 때문에 자신의 삶 전체가 흔들리는 일을 줄일 수 있습니다. 다른 사람을 존중하면서도 자신의 자리를 지킬 수 있는 힘이 잘 형성되어 있습니다. 그 경계를 지키는 것은 이기적인 선택이 아니라, 오래도록 다른 사람과 함께하기 위해 자신을 돌보는 방법이 될 수 있습니다."]]}, {"sub": null, "stem": "다음은 가치 있는 일을 많이 해야 자신의 존재감도 높아진다고 느끼는 경향성에 대한 질문입니다.", "opts": ["일을 하지 않거나 필요한 일을 해내지 못하면 내가 가치 없는 사람처럼 느껴진다.", "쉬고 있으면 해야 할 일을 하지 않고 있다는 생각 때문에 마음이 불편하고, 다시 무언가를 해야 할 것 같다.", "내가 하는 일의 가치와 나 자신의 가치를 구별해서 생각할 수 있다.", "많은 일을 하거나 인정받는 일을 하지 않아도 나 자신의 가치는 달라지지 않는다고 느낀다."], "fb": [["당신은 일을 하지 않거나 필요한 일을 해내지 못하면 자신이 가치 없는 사람처럼 느껴진다고 응답하셨습니다. 이렇게 되면 쉬어야 할 때에도 일을 멈추는 것이 어렵고, 일을 통해 자신의 가치를 확인하려 할 수 있습니다. 그러다 보면 몸과 마음이 지쳐 있어도 자신에게 필요한 쉼을 허락하지 못한 채 계속해서 무언가를 해내려고 할 수 있습니다. 결국 쉼의 시간에도 ‘나는 지금 무엇을 하고 있는가’라는 생각에서 벗어나기 어려워지고, 자신만의 쉼의 공간을 온전히 누리지 못하게 될 수 있습니다.", "지금 필요한 것은 더 많은 일을 해내는 것이 아니라, 아무것도 하지 않는 시간에도 나의 가치가 줄어들지 않는다는 것을 경험하는 것입니다."], ["당신은 쉬고 있을 때에도 해야 할 일을 하지 않고 있다는 생각 때문에 마음이 불편하고, 다시 무언가를 해야 할 것 같다고 응답하셨습니다. 이렇게 되면 실제로는 쉬고 있어도 마음은 계속 일하고 있어 충분한 회복이 이루어지기 어려울 수 있습니다. 잠시 멈추어 있는 동안에도 해야 할 일을 생각하다 보면, 자신에게 주어진 쉼의 시간과 공간을 온전히 누리지 못하게 됩니다. 결국 쉼이 회복의 시간이 되기보다 또 다른 일을 준비하는 시간이 되어 피로가 계속 이어질 수 있습니다.", "지금 필요한 것은 쉬는 동안에도 무언가를 해야 한다는 마음에서 잠시 벗어나, 쉼 자체가 나에게 필요한 일이라는 것을 받아들이는 연습입니다."], ["당신은 자신이 하는 일의 가치와 자신의 가치를 구별해서 생각할 수 있다고 응답하셨습니다. 이렇게 되면 일을 많이 하거나 성과를 내는 것만으로 자신의 가치를 판단하지 않고, 일하지 않는 시간에도 자신을 있는 그대로 바라볼 수 있습니다. 그래서 필요한 때에는 일을 멈추고 자신에게 필요한 쉼의 시간과 공간을 마련할 수 있습니다. 자신이 한 일과 자신의 존재 가치를 구별할 수 있다는 것은 쉼을 받아들일 수 있는 중요한 힘입니다. 지금 가지고 있는 이 균형감각을 잘 지켜가십시오."], ["당신은 많은 일을 하거나 인정받는 일을 하지 않아도 자신의 가치는 달라지지 않는다고 느낀다고 응답하셨습니다. 이렇게 되면 무엇인가를 계속 해내야만 자신을 증명하려 하지 않고, 필요한 때에는 다른 사람의 요구와 성과에서 잠시 벗어나 자신의 쉼을 온전히 누릴 수 있습니다. 일을 하지 않는 시간에도 자신의 가치를 의심하지 않기 때문에, 나만의 시간과 공간을 지키는 일도 자연스럽게 받아들일 수 있습니다. 무엇을 해냈는가와 상관없이 자신의 가치를 인정할 수 있다는 것은 자신을 깊이 돌볼 수 있는 든든한 기반입니다."]]}, {"sub": null, "stem": "사역이나 공동체에서 다른 사람에게 무시당하거나 평가절하되었다고 느끼는 상황을 가정해봅니다. 그럴 때 마음이 얼마나 상합니까?", "opts": ["그 일을 오래 붙들고 있으며, 그 말 때문에 나 자신까지 초라하게 느낀다.", "마음이 크게 상하고 한동안 그 일이 마음에서 떠나지 않는다.", "순간적으로 마음이 상하지만 비교적 빨리 지나간다.", "그런 일을 겪어도 마음이 거의 흔들리지 않는다."], "fb": [["당신은 다른 사람에게 무시당하거나 평가절하된 일을 오래 붙들고 있으며, 그 말 때문에 자신까지 초라하게 느낀다고 응답하셨습니다. 이렇게 되면 다른 사람의 평가나 무시하는 말이 단순한 한 사건으로 지나가지 않고, 자신의 모습과 가치에 대한 생각까지 흔들게 될 수 있습니다. 한 번의 평가가 오래 마음에 남아 이후의 선택이나 관계에서도 자신을 낮추어 바라보게 될 수 있습니다. 결국 다른 사람이 나를 어떻게 대했는지가 내가 나를 바라보는 기준까지 좌우하게 될 수 있습니다.", "지금 필요한 것은 다른 사람의 평가와 자신의 가치를 조금씩 구별해 보는 것입니다."], ["당신은 무시당하거나 평가절하된 경험으로 마음이 크게 상하고, 한동안 그 일이 마음에서 떠나지 않는다고 응답하셨습니다. 이렇게 되면 이미 지나간 일을 계속 떠올리면서 당시의 말이나 상황에 마음이 붙들릴 수 있습니다. 그 결과 다른 사람의 평가가 현재의 나를 바라보는 데까지 영향을 미칠 수 있습니다. 마음이 상한 경험이 오래 지속되면 자신에게 필요한 쉼을 누리는 것에도 영향을 줄 수 있습니다.", "지금 필요한 것은 상처받은 마음을 억지로 없애는 것이 아니라, 그 경험과 자신의 가치를 구별하면서 다시 자신의 자리로 돌아오는 것입니다."], ["당신은 무시당하거나 평가절하된 경험에 순간적으로 마음이 상하지만 비교적 빨리 지나간다고 응답하셨습니다. 이렇게 되면 다른 사람의 평가를 경험으로 받아들이면서도 그것이 자신의 전체 가치를 결정하도록 내버려두지는 않을 수 있습니다. 상한 마음을 지나 다시 자신의 자리와 해야 할 일을 바라볼 수 있기 때문에, 다른 사람의 말에 오래 붙들리지 않을 수 있습니다. 상처를 받지 않는 것이 아니라, 상처받은 마음을 다시 자신의 자리로 돌려놓을 수 있는 힘이 있다는 점이 좋습니다."], ["그런 일을 겪어도 마음이 거의 흔들리지 않는다고 하셨습니다. 다른 사람의 무시나 평가절하가 자신의 가치를 판단하는 기준이 되지 않고, 그 경험과 자신의 존재 가치를 구별할 수 있는 상태입니다. 이렇게 자신의 가치를 다른 사람의 평가에 맡기지 않을 수 있으면, 인정받지 못하는 상황에서도 자신을 낮추거나 자신의 자리를 잃지 않을 수 있습니다. 다른 사람의 말보다 자신의 가치에 대한 기준을 안쪽에 두고 살아갈 수 있게 됩니다. 다른 사람의 평가와 자신의 가치를 구별할 수 있는 힘을 이미 가지고 계신다는 점이 참 든든합니다."]]}]}, {"id": "chet", "label": "헤트", "letter": "ח", "qTitle": "헤트 · 도움을 청하고 받아들이는 힘", "qSub": null, "intro": [], "items": [{"sub": null, "stem": "힘든 일이 생긴 상황입니다. 나는 다른 사람에게 도움을 요청합니까, 혼자 해결하려 합니까?", "opts": ["힘들어도 혼자 감당해야 한다고 생각하며 주변에 알리지 않는다.", "도움이 필요하다는 것은 알지만 말을 꺼내기가 어렵다.", "필요한 부분은 신뢰하는 사람을 골라 조심스럽게 도움을 요청한다.", "도움이 필요하다고 느끼는 즉시 주저하지 않고 요청한다."], "fb": [["당신은 힘들어도 혼자 감당해야 한다고 생각하며 주변에 알리지 않는다고 응답하셨습니다. 이렇게 되면 어려운 상황에서도 다른 사람에게 자신의 상태를 알리거나 도움을 요청하지 않고 혼자 해결하려고 하게 될 수 있습니다. 그러다 보면 실제로 도움을 받을 수 있는 상황에서도 혼자 버티느라 힘이 더 커질 수 있습니다. 혼자 감당하는 것이 익숙해질수록 다른 사람의 도움을 받아 다시 일어설 기회도 놓치기 쉽습니다. 지금 필요한 것은 모든 일을 다른 사람에게 맡기는 것이 아니라, 혼자 감당하기 어려운 순간에는 도움을 요청할 수 있다는 것을 받아들이는 것입니다."], ["당신은 도움이 필요하다는 것은 알지만 말을 꺼내기가 어렵다고 응답하셨습니다. 이렇게 되면 혼자서는 감당하기 어려운 상황에서도 도움을 요청하지 못하고 계속 버티게 될 수 있습니다. 도움이 필요하다는 사실은 알고 있지만, 실제로 손을 내미는 순간에는 망설이게 되는 것입니다. 그러다 보면 누군가 기꺼이 도와줄 수 있는 상황에서도 자신의 어려움을 혼자 안고 지나갈 수 있습니다. 필요한 도움을 말로 표현하고 받아들이는 연습이 필요합니다."], ["당신은 필요한 부분은 신뢰하는 사람을 골라 조심스럽게 도움을 요청한다고 응답하셨습니다. 이렇게 되면 혼자 감당해야 한다고 생각하기보다, 자신에게 필요한 도움을 분별하고 적절한 사람에게 요청할 수 있습니다. 누구에게나 의지하는 것이 아니라 신뢰할 수 있는 사람을 선택하기 때문에, 도움을 받으면서도 자신의 상황을 스스로 조절할 수 있습니다. 자신의 어려움을 인정하면서 필요한 도움을 받아들일 수 있는 힘이 잘 형성되고 있습니다."], ["당신은 도움이 필요하다고 느끼는 즉시 주저하지 않고 요청한다고 응답하셨습니다. 이렇게 되면 어려움이 커질 때까지 혼자 버티기보다 필요한 순간에 다른 사람의 도움을 받아 상황을 함께 감당할 수 있습니다. 자신의 어려움을 인정하고 도움을 요청할 수 있기 때문에, 혼자 해결해야 한다는 부담에 지나치게 매이지 않을 수 있습니다. 필요한 순간에 도움을 요청하고 받아들일 수 있는 힘이 잘 자리 잡고 있습니다."]], "st": ["혼자 감당하려는 상태", "도움을 요청하기 어려운 상태", "필요한 도움을 선택해서 요청하는 상태", "필요할 때 도움을 요청할 수 있는 상태"]}, {"sub": null, "stem": "완전히 지쳐 쓰러질 것 같던 순간, 예상치 못한 도움이나 손길로 다시 일어난 경험이 있는지 돌아보는 상황입니다.", "opts": ["그런 순간이 있었는지 잘 기억나지 않고, 대부분 스스로 버텨서 넘겼다고 생각한다.", "도움을 받은 순간이 있었지만 그것을 도움으로 여기기보다 우연이라고 생각했다.", "완전히 지쳤을 때 뜻밖의 도움으로 다시 일어섰던 순간이 떠오른다.", "가장 탈진했던 순간에 찾아온 도움을 지금도 또렷하게 기억하며, 그 경험이 나를 붙들어 준다."], "fb": [["당신은 완전히 지쳐 쓰러질 것 같던 순간에도 대부분 스스로 버텨서 넘겼다고 생각한다고 응답하셨습니다. 이렇게 되면 어려운 순간을 지나온 경험에서도 다른 사람의 도움이나 예상하지 못했던 손길을 자신의 회복 과정에서 잘 인식하지 못할 수 있습니다. 그러다 보면 힘든 일이 생겼을 때에도 다시 혼자 버텨야 한다고 생각하게 될 수 있습니다. 혼자 견뎌낸 경험이 많을수록 도움을 받아 다시 일어선 경험도 놓치기 쉽습니다. 지금 필요한 것은 모든 것을 다른 사람에게 의지하는 것이 아니라, 내가 힘든 순간에 받았던 도움도 함께 돌아보는 것입니다."], ["당신은 도움을 받은 순간이 있었지만 그것을 도움으로 여기기보다 우연이라고 생각했다고 응답하셨습니다. 이렇게 되면 실제로 누군가의 손길을 통해 다시 일어선 경험이 있어도, 그것을 자신의 삶을 붙들어 준 도움으로 받아들이지 못할 수 있습니다. 그러다 보면 다시 어려운 상황에 놓였을 때에도 이전에 도움을 받았다는 사실을 떠올리지 못하고 혼자 해결하려 할 수 있습니다. 지나온 경험 속에서 어떤 도움을 받았는지 돌아보는 것은 앞으로 힘든 시간을 지나갈 때에도 중요한 힘이 될 수 있습니다."], ["당신은 완전히 지쳤을 때 뜻밖의 도움으로 다시 일어섰던 순간이 떠오른다고 응답하셨습니다. 이렇게 되면 힘든 순간에도 모든 것을 혼자 감당했던 것만 기억하는 것이 아니라, 예상하지 못했던 도움을 통해 다시 일어섰던 경험도 함께 기억할 수 있습니다. 그런 경험은 앞으로 어려운 상황을 만났을 때에도 반드시 혼자 해결해야 하는 것은 아니라는 것을 알려줄 수 있습니다. 이미 자신의 삶에서 도움을 받아 다시 일어선 경험을 기억하고 있다는 것은, 어려움 속에서도 다른 가능성을 바라볼 수 있는 힘입니다."], ["당신은 가장 탈진했던 순간에 찾아온 도움을 지금도 또렷하게 기억하며, 그 경험이 자신을 붙들어 준다고 응답하셨습니다. 이렇게 되면 가장 힘들었던 순간에도 자신이 혼자 버려져 있었던 것만 기억하는 것이 아니라, 그때 찾아왔던 도움과 손길을 함께 기억할 수 있습니다. 그래서 지금 다시 어려운 상황에 놓이더라도 과거에 받았던 도움의 경험을 통해 자신을 붙들어 줄 힘을 얻을 수 있습니다. 힘든 순간에 찾아왔던 도움을 기억하고 그것이 지금의 자신을 붙들어 주는 힘으로 남아 있다는 것은 소중한 자산입니다."]], "st": ["스스로 버텨서 넘겨왔다고 생각하는 상태", "도움을 받았지만 우연이라고 생각하는 상태", "뜻밖의 도움으로 다시 일어섰던 경험을 기억하는 상태", "도움을 받았던 경험이 지금도 자신을 붙들어 주는 상태"]}, {"sub": null, "stem": "나를 지치게 하는 환경이나 관계가 계속되는 상황입니다. 나는 어떻게 합니까?", "opts": ["힘들어도 내가 적응해야 한다고 생각하며 그대로 견딘다.", "바꾸고 싶지만 현실적으로 어렵다고 생각하며 참는다.", "내가 바꿀 수 있는 부분부터 일정이나 관계 방식을 조정한다.", "필요하다면 환경 자체를 바꾸거나 옮겨서 나를 보호한다."], "fb": [["당신은 힘들어도 자신이 적응해야 한다고 생각하며 그대로 견딘다고 응답하셨습니다. 이렇게 되면 나를 지치게 하는 환경이나 관계가 계속되어도 상황을 바꾸기보다 자신이 더 견뎌야 한다고 생각하게 될 수 있습니다. 그러다 보면 이미 감당하기 어려운 상황에서도 자신의 상태를 돌아보기보다 환경에 자신을 맞추게 될 수 있습니다. 결국 자신을 보호해야 할 때에도 계속해서 참고 버티는 방식이 반복될 수 있습니다. 지금 필요한 것은 무조건 환경을 바꾸는 것이 아니라, 무엇이 자신을 지치게 하는지 살펴보고 자신을 보호할 수 있는 방법을 찾는 것입니다."], ["당신은 바꾸고 싶지만 현실적으로 어렵다고 생각하며 참는다고 응답하셨습니다. 이렇게 되면 지금의 환경이나 관계가 자신을 지치게 한다는 것을 알고 있으면서도, 달리 방법이 없다고 생각해 계속 견디게 될 수 있습니다. 상황을 바꾸기 어려운 현실적인 이유가 있을 수 있지만, 참는 시간이 길어질수록 자신의 필요와 한계를 뒤로 미루게 될 수 있습니다. 그러다 보면 도움을 요청하거나 조정할 수 있는 부분까지도 포기하게 될 수 있습니다. 지금 필요한 것은 당장 모든 것을 바꾸는 것이 아니라, 현재 상황에서 자신을 보호할 수 있는 작은 변화부터 찾아보는 것입니다."], ["당신은 자신이 바꿀 수 있는 부분부터 일정이나 관계 방식을 조정한다고 응답하셨습니다. 이처럼 자신이 바꿀 수 있는 부분을 살피고 조정할 수 있으면, 힘든 환경이나 관계 속에서도 자신을 보호하기 위해 필요한 변화를 선택할 수 있습니다. 자신의 일정이나 관계 방식을 조금씩 바꾸면서 지치는 정도를 줄이고, 필요한 경우 다른 사람의 도움을 받을 수도 있습니다. 모든 상황을 한꺼번에 바꾸지 않더라도 자신을 보호하기 위해 할 수 있는 일을 찾아 조정할 수 있다는 것은 중요한 힘입니다."], ["당신은 필요하다면 환경 자체를 바꾸거나 옮겨서 자신을 보호한다고 응답하셨습니다. 이처럼 자신을 계속 지치게 하는 환경에 무조건 적응하려 하기보다, 그 환경에서 벗어나는 것도 자신을 돌보는 방법으로 선택할 수 있습니다. 자신이 감당할 수 있는 범위를 알고 있기 때문에 필요한 경우 관계나 환경에 새로운 경계를 세우고 자신의 자리를 보호할 수 있습니다. 자신을 지키기 위해 필요한 변화를 선택할 수 있는 힘이 잘 형성되어 있습니다."]], "st": ["힘든 환경에 자신을 맞추며 견디는 상태", "바꾸기 어렵다고 생각하며 참는 상태", "자신이 바꿀 수 있는 부분부터 조정하는 상태", "자신을 보호하기 위해 환경을 바꿀 수 있는 상태"]}, {"sub": null, "stem": "지금 힘든 자리에 있다면, 예전에 경험했던 그 도움을 다시 신뢰하며 기다릴 수 있는지 돌아보는 상황입니다.", "opts": ["예전에 도움을 받은 적이 있어도, 지금은 그런 도움이 다시 올 것이라 믿기 어렵다.", "도움이 올 수도 있다고 생각하지만, 기다리는 동안 불안한 마음이 크다.", "예전의 경험을 떠올리며 지금도 도움이 올 것을 어느 정도 신뢰할 수 있다.", "어떤 모습으로 올지는 몰라도, 필요한 순간에 도움이 온다는 것을 신뢰하며 기다릴 수 있다."], "fb": [["당신은 예전에 도움을 받은 적이 있어도, 지금은 그런 도움이 다시 올 것이라 믿기 어렵다고 응답하셨습니다. 이렇게 되면 과거에 도움을 받았던 경험이 있어도 현재의 어려움에서는 그 경험을 다시 의지하기 어려울 수 있습니다. 지금의 힘든 상황이 너무 크게 느껴지면, 이전에 자신을 붙들어 주었던 도움까지도 일시적인 일이었다고 생각하게 될 수 있습니다. 그러다 보면 다시 어려움이 찾아왔을 때 혼자 견뎌야 한다는 생각이 커질 수 있습니다. 지금 필요한 것은 억지로 믿으려 하는 것이 아니라, 과거에 실제로 도움을 받았던 경험을 다시 천천히 돌아보는 것입니다."], ["당신은 도움이 올 수도 있다고 생각하지만, 기다리는 동안 불안한 마음이 크다고 응답하셨습니다. 이렇게 되면 도움의 가능성을 완전히 부정하지는 않지만, 실제로 도움이 오기 전까지는 불안과 걱정이 마음을 크게 흔들 수 있습니다. 기다리는 시간이 길어질수록 정말 도움이 올 것인지 의심하게 되거나, 불안을 견디기 위해 스스로 모든 것을 해결하려 할 수도 있습니다. 과거에 도움을 받은 경험을 기억하고 있더라도 현재의 기다림은 여전히 쉽지 않은 것입니다. 지금 필요한 것은 불안한 마음이 있다는 것을 인정하면서도, 아직 오지 않은 도움의 가능성까지 미리 닫아버리지 않는 것입니다."], ["당신은 예전의 경험을 떠올리며 지금도 도움이 올 것을 어느 정도 신뢰할 수 있다고 응답하셨습니다. 이처럼 과거에 받았던 도움을 현재의 어려움에서도 기억할 수 있으면, 아직 상황이 달라지지 않았더라도 이전의 경험을 통해 다시 도움을 기대할 수 있습니다. 어떤 모습으로 도움이 올지는 알 수 없지만, 자신을 붙들어 주었던 경험이 현재의 기다림을 견디는 힘이 될 수 있습니다. 과거의 경험을 현재의 신뢰로 연결할 수 있다는 것은 어려움 속에서도 자신을 붙들어 주는 중요한 힘입니다."], ["당신은 어떤 모습으로 올지는 몰라도, 필요한 순간에 도움이 온다는 것을 신뢰하며 기다릴 수 있다고 응답하셨습니다. 이처럼 도움의 방법이나 시기를 미리 정하지 않고 기다릴 수 있으면, 현재의 상황이 어렵고 앞이 분명하지 않아도 자신을 붙들어 주었던 경험을 기억하며 필요한 도움을 기대할 수 있습니다. 예상하지 못한 방식으로 찾아오는 도움도 받아들일 수 있기 때문에, 도움의 가능성을 자신의 방식으로 제한하지 않을 수 있습니다. 어떤 모습으로 올지는 몰라도 필요한 순간에 도움이 온다는 것을 신뢰할 수 있는 힘이 잘 자리 잡고 있습니다."]], "st": ["다시 도움이 올 것을 믿기 어려운 상태", "도움을 믿지만 기다리는 동안 불안한 상태", "이전의 도움을 기억하며 다시 신뢰할 수 있는 상태", "도움이 올 것을 신뢰하며 기다릴 수 있는 상태"]}, {"sub": null, "stem": "혼자 감당하기 어려운 사역이나 개인적인 어려움을 겪고 있는 상황을 가정해봅니다. 누군가가 내 곁에서 도와주었으면 하는 마음이 얼마나 듭니까?", "opts": ["누군가가 나를 도와주기를 간절히 바라는 마음이 매우 크다.", "누군가의 도움을 받고 싶은 마음이 크게 든다.", "가끔 누군가의 도움을 받고 싶다는 생각이 든다.", "누군가의 도움을 받고 싶다는 마음이 거의 들지 않는다."], "fb": [["당신은 누군가가 자신을 도와주기를 간절히 바라는 마음이 매우 크다고 응답하셨습니다. 이렇게 되면 혼자 감당하기 어려운 상황에서 누군가가 곁에 와서 자신을 도와주기를 강하게 바라게 될 수 있습니다. 도움을 받고 싶은 마음이 크다는 것은 그만큼 지금 감당하고 있는 부담이 크다는 의미일 수도 있습니다. 그러나 도움을 바라는 마음이 간절할수록 정작 어떤 도움이 필요한지, 누구에게 요청할 수 있는지를 구체적으로 살피기 어려울 수도 있습니다. 지금 필요한 것은 도움을 바라는 마음을 억누르는 것이 아니라, 내가 필요로 하는 도움이 무엇인지 구체적으로 살펴보는 것입니다."], ["당신은 누군가의 도움을 받고 싶은 마음이 크게 든다고 응답하셨습니다. 이렇게 되면 어려운 상황에서 혼자 감당하기보다 누군가가 곁에서 함께해 주기를 바라는 마음이 커질 수 있습니다. 자신의 어려움을 혼자 해결하기 어렵다고 느끼고 있다는 점에서, 현재 자신에게 필요한 도움을 살펴볼 필요가 있습니다. 도움을 받고 싶은 마음을 인정하고 나면 막연히 누군가가 도와주기를 기다리기보다 어떤 도움이 필요한지 조금 더 분명하게 바라볼 수 있습니다."], ["당신은 가끔 누군가의 도움을 받고 싶다는 생각이 든다고 응답하셨습니다. 이처럼 자신의 힘으로 감당할 수 있는 부분과 다른 사람의 도움이 필요한 부분을 함께 살필 수 있으면, 어려움을 만났을 때 혼자 해결해야 한다고 생각하기보다 필요한 도움을 받아들일 수 있습니다. 혼자 감당할 수 있는 부분은 스스로 해내면서도 필요한 순간에는 다른 사람의 도움을 생각할 수 있기 때문에, 자신의 힘과 다른 사람의 도움을 함께 활용할 수 있습니다. 필요한 순간에 도움을 받아들일 수 있으면서도 자신의 힘으로 살아갈 수 있는 균형이 잘 형성되어 있습니다."], ["당신은 누군가의 도움을 받고 싶다는 마음이 거의 들지 않는다고 응답하셨습니다. 이처럼 자신의 힘으로 어려움을 감당할 수 있으면, 혼자서도 자신의 삶과 사역을 책임지고 필요한 일을 해낼 수 있습니다. 다른 사람의 도움을 받아야만 어려움을 해결할 수 있다고 생각하지 않기 때문에, 자신의 판단과 힘으로 상황을 감당할 수 있습니다. 스스로 자신의 삶을 감당할 수 있는 힘이 잘 자리 잡고 있습니다."]], "st": ["도움을 간절히 바라고 있는 상태", "도움을 받고 싶은 마음이 큰 상태", "필요할 때 도움을 생각할 수 있는 상태", "자신의 힘으로 감당할 수 있는 상태"]}]}, {"id": "gimel", "label": "기멜", "letter": "ג", "qTitle": "기멜 · 존재와 역할의 분리", "qSub": null, "intro": [], "items": [{"sub": null, "stem": "맡은 일이 없거나 나를 찾는 사람이 없는 상황입니다. 나는 어떤 마음이 듭니까?", "opts": ["아무 역할이 없으면 내가 쓸모없는 사람처럼 느껴져 불안하다.", "마음이 허전해서 무엇이라도 찾아서 하려고 한다.", "처음엔 불편해도 지금 정말 필요한 일이 무엇인지 차분히 살핀다.", "맡은 일이 없어도 나의 가치나 존재를 의심하지 않는다."], "fb": [["당신은 아무 역할이 없으면 자신이 쓸모없는 사람처럼 느껴져 불안하다고 응답하셨습니다. 이렇게 되면 맡은 일이 없거나 자신을 찾는 사람이 없는 순간에 자신의 존재 가치까지 의심하게 될 수 있습니다. 그래서 특별히 해야 할 일이 없어도 무엇인가를 찾아 움직이게 되고, 쉬고 있는 시간을 편안하게 받아들이기 어려울 수 있습니다. 결국 자신의 가치보다 자신이 맡고 있는 역할이 자신을 판단하는 기준이 되기 쉽습니다. 지금 필요한 것은 아무것도 하지 않는 시간을 견디는 것이 아니라, 맡은 역할이 없어도 자신의 가치가 사라지는 것은 아니라는 사실을 조금씩 구별해 보는 것입니다."], ["당신은 맡은 일이 없으면 마음이 허전해서 무엇이라도 찾아서 하려고 한다고 응답하셨습니다. 이렇게 되면 특별히 해야 할 일이 없어도 빈자리를 견디기보다 새로운 일을 찾아 움직이게 될 수 있습니다. 일을 하고 있으면 마음이 안정되지만, 일이 줄어들면 내가 무엇을 해야 하는지 다시 찾아야 한다는 부담이 생길 수 있습니다. 그러다 보면 지금 정말 필요한 일이 무엇인지 살펴보기보다, 일 자체로 허전함을 채우려 할 수 있습니다. 지금 필요한 것은 일을 더 만드는 것이 아니라, 아무 역할이 없는 시간에도 자신의 상태와 필요를 차분히 바라보는 것입니다."], ["당신은 처음에는 불편해도 지금 정말 필요한 일이 무엇인지 차분히 살핀다고 응답하셨습니다. 맡은 일이 없다는 사실에 바로 흔들리기보다, 자신의 불편한 마음을 알아차리고 지금 필요한 것이 무엇인지 살펴볼 수 있는 상태입니다. 해야 할 일이 있다는 이유만으로 움직이지 않고, 정말 필요한 일과 단지 마음을 채우기 위해 찾는 일을 구별하려고 합니다. 자신의 역할을 통해 가치를 확인하기보다 지금 자신에게 주어진 상황을 바라보고 선택할 수 있는 분별력이 잘 형성되어 있습니다."], ["당신은 맡은 일이 없어도 자신의 가치나 존재를 의심하지 않는다고 응답하셨습니다. 일을 하고 있거나 누군가가 자신을 필요로 해야만 자신의 존재 가치를 확인하지 않아도 되는 상태입니다. 맡은 역할이 줄어들거나 자신을 찾는 사람이 없는 순간에도 자신에 대한 기준을 잃지 않을 수 있습니다. 무엇을 하고 있는가와 자신이 어떤 사람인가는 서로 다른 것임을 알고 있으며, 역할이 없어도 자신의 자리를 잃지 않는 힘이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "내가 맡은 일이 잘 안 되어 다른 사람에게 맡겨야 하는 상황입니다. 나는 어떻게 합니까?", "opts": ["내가 직접 해야 마음이 놓여 결국 다시 내가 떠맡는다.", "다른 사람이 해낼지 걱정되어 계속 확인하고 개입한다.", "내 몫과 다른 사람의 몫을 나누어 보려고 시도한다.", "다른 사람의 몫을 믿고 맡기며 내 책임에만 집중한다."], "fb": [["당신은 맡은 일이 잘되지 않으면 자신이 직접 해야 마음이 놓여 결국 다시 떠맡는다고 응답하셨습니다. 이렇게 되면 다른 사람에게 일을 맡겼더라도 결과가 걱정되어 다시 자신의 몫으로 가져오게 될 수 있습니다. 다른 사람이 잘하지 못할 것이라는 불안 때문에 직접 확인하고 처리하는 일이 반복되면, 실제로 자신의 책임보다 훨씬 많은 일을 감당하게 될 수 있습니다. 그러다 보면 다른 사람에게 역할을 맡길 기회도 줄어들고, 결국 모든 일을 자신이 책임져야 한다는 부담이 커질 수 있습니다. 지금 필요한 것은 일을 놓아버리는 것이 아니라, 내 몫과 다른 사람의 몫을 구별하는 것입니다."], ["당신은 다른 사람이 일을 잘 해낼지 걱정되어 계속 확인하고 개입한다고 응답하셨습니다. 이렇게 되면 다른 사람에게 일을 맡긴 뒤에도 결과를 계속 확인하게 되고, 마음이 놓이지 않아 다시 개입하게 될 수 있습니다. 다른 사람이 맡은 일을 믿고 기다리기보다 자신이 계속 관리해야 한다는 부담이 커질 수 있습니다. 그러다 보면 다른 사람에게 책임을 맡기는 과정에서도 자신의 에너지를 계속 사용하게 됩니다. 지금 필요한 것은 모든 과정을 내려놓는 것이 아니라, 어디까지가 자신의 책임이고 어디부터가 다른 사람의 몫인지 구별해 보는 것입니다."], ["당신은 자신의 몫과 다른 사람의 몫을 나누어 보려고 시도한다고 응답하셨습니다. 자신이 모든 일을 직접 해야 한다고 생각하기보다, 각 사람이 감당해야 할 몫을 구별하려는 힘이 있습니다. 다른 사람에게 일을 맡기는 과정에서 걱정이 생기더라도 자신의 책임과 다른 사람의 책임을 함께 살펴보면서 조정할 수 있습니다. 모든 결과를 자신이 책임지려고 하기보다 함께 일하는 사람에게 자신의 몫을 맡길 수 있는 방향으로 나아가고 있습니다."], ["당신은 다른 사람의 몫을 믿고 맡기며 자신의 책임에 집중할 수 있다고 응답하셨습니다. 모든 일을 직접 확인하고 통제하려 하기보다 각 사람에게 맡겨진 몫을 인정하고 자신의 책임에 집중할 수 있는 상태입니다. 다른 사람이 자신의 방식으로 일을 해내는 것을 받아들이면서도, 자신이 반드시 감당해야 할 부분은 놓치지 않을 수 있습니다. 모든 결과를 자신의 손으로 만들어야 한다는 부담에서 벗어나 자신의 역할에 집중할 수 있는 힘이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "나를 꼭 필요로 한다는 이유로 감당하기 벅찬 일을 맡아달라는 상황입니다. 나는 어떻게 합니까?", "opts": ["나를 필요로 한다는 생각에 힘들어도 결국 그 일을 맡는다.", "거절하면 나를 필요 없는 사람처럼 여길까 봐 거절하지 못한다.", "그 일이 정말 내가 맡아야 할 일인지 먼저 생각해 본다.", "필요한 사람이고 싶은 마음과 실제 내 몫을 구별해서 선택한다."], "fb": [["당신은 자신을 필요로 한다는 생각에 힘들어도 결국 그 일을 맡는다고 응답하셨습니다. 이렇게 되면 자신의 상황이나 감당할 수 있는 범위를 살펴보기보다, 누군가 자신을 필요로 한다는 이유만으로 일을 받아들이게 될 수 있습니다. 힘들다는 사실을 알고 있으면서도 자신이 아니면 안 될 것이라는 생각 때문에 거절하기 어려워질 수 있습니다. 그러다 보면 실제로 자신의 몫이 아닌 일까지 맡게 되고, 자신의 시간과 에너지를 지나치게 사용하게 될 수 있습니다. 지금 필요한 것은 필요한 사람이 되는 것과 반드시 그 일을 맡아야 하는 것을 구별해 보는 것입니다."], ["당신은 거절하면 자신을 필요 없는 사람처럼 여길까 봐 거절하지 못한다고 응답하셨습니다. 이렇게 되면 일을 맡을 것인지 결정하는 기준이 자신의 상황이나 책임보다 다른 사람이 자신을 어떻게 생각할지에 놓이게 될 수 있습니다. 거절하는 순간 자신의 가치까지 낮아지는 것처럼 느껴질 수 있기 때문에, 감당하기 어려운 일도 받아들이게 될 수 있습니다. 그러다 보면 누군가에게 필요한 사람이 되고 싶은 마음이 실제 자신의 몫보다 앞서게 될 수 있습니다. 지금 필요한 것은 거절할 수 있는 사람이 되는 것보다, 어떤 일을 맡고 맡지 않는 것이 자신의 가치와는 다른 문제임을 구별해 보는 것입니다."], ["당신은 그 일이 정말 자신이 맡아야 할 일인지 먼저 생각해 본다고 응답하셨습니다. 누군가 자신을 필요로 한다는 사실만으로 바로 결정하지 않고, 그 일이 자신의 몫인지 살펴볼 수 있는 힘이 있습니다. 상대의 필요를 외면하지 않으면서도 자신의 상황과 책임을 함께 바라보고 선택할 수 있습니다. 필요한 사람이라는 이유와 실제로 맡아야 할 일인지를 구별할 수 있다는 것은 자신의 역할을 보다 건강하게 바라볼 수 있는 중요한 분별력입니다."], ["당신은 필요한 사람이고 싶은 마음과 실제 자신의 몫을 구별해서 선택한다고 응답하셨습니다. 자신이 필요한 사람으로 인정받고 싶은 마음이 있을 수 있다는 사실을 알고 있으면서도, 그것이 자신의 선택을 결정하도록 내버려두지 않을 수 있습니다. 누군가의 필요에 응답할 때에도 그것이 정말 자신이 감당해야 할 몫인지 살펴볼 수 있습니다. 인정받고 싶은 마음과 사역의 책임을 구별해서 자신의 몫을 선택할 수 있는 분별력이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "사명감과 인정받고 싶은 마음이 함께 섞여 있는 상황입니다. 나는 어느 쪽에 더 이끌립니까?", "opts": ["두 마음을 구별하기 어렵고 인정받는 느낌이 있어야 힘이 난다.", "인정받고 싶은 마음이 섞여 있다는 것은 알지만 분리하기 어렵다.", "두 마음이 섞여 있을 수 있음을 인정하고 살펴보려 한다.", "인정받는 것과 관계없이 감당해야 할 몫에 집중할 수 있다."], "fb": [["당신은 사명감과 인정받고 싶은 마음을 구별하기 어렵고, 인정받는 느낌이 있어야 힘이 난다고 응답하셨습니다. 이렇게 되면 내가 왜 이 일을 하고 있는지 살펴볼 때 사명과 인정받고 싶은 마음이 서로 섞여 있을 수 있습니다. 좋은 결과를 내거나 사람들에게 인정받으면 힘이 나지만, 인정받지 못하는 상황에서는 사명 자체까지 흔들리는 것처럼 느껴질 수 있습니다. 그러다 보면 내가 감당해야 할 몫보다 다른 사람의 반응이 일을 계속하게 하는 중요한 기준이 될 수 있습니다. 지금 필요한 것은 인정받고 싶은 마음을 없애는 것이 아니라, 그 마음과 내가 감당해야 할 몫을 조금씩 구별해 보는 것입니다."], ["당신은 인정받고 싶은 마음이 섞여 있다는 것은 알지만 그것을 분리하기 어렵다고 응답하셨습니다. 자신에게 인정받고 싶은 마음이 있다는 사실을 어느 정도 알고 있지만, 실제로 일을 선택하고 감당하는 과정에서는 그 마음이 사명과 함께 움직일 수 있습니다. 그래서 좋은 결과를 내거나 사람들에게 인정받을 때에는 힘이 나지만, 그렇지 않을 때에는 내가 이 일을 왜 하고 있는지 다시 생각하게 될 수도 있습니다. 자신의 마음을 이미 바라보고 있다는 것은 중요한 시작입니다. 이제 사명으로 선택한 것과 인정받고 싶은 마음에서 선택한 것을 조금씩 구별해 볼 수 있습니다."], ["당신은 사명감과 인정받고 싶은 마음이 함께 섞여 있을 수 있음을 인정하고 살펴보려 한다고 응답하셨습니다. 자신의 동기를 한 가지 이유로 단정하지 않고, 여러 마음이 함께 있을 수 있다는 사실을 받아들일 수 있는 상태입니다. 인정받고 싶은 마음이 있다고 해서 자신의 사명이 사라지는 것은 아니며, 그 마음을 살펴보면서 무엇이 자신을 움직이고 있는지 구별할 수 있습니다. 자신의 마음을 정직하게 바라보고 그 안에서 실제로 감당해야 할 몫을 찾아가려는 분별력이 잘 자라고 있습니다."], ["당신은 인정받는 것과 관계없이 감당해야 할 몫에 집중할 수 있다고 응답하셨습니다. 다른 사람의 칭찬이나 평가가 자신의 선택을 결정하는 기준이 되지 않고, 지금 자신이 감당해야 할 일을 바라볼 수 있는 상태입니다. 좋은 결과가 나올 때만 힘을 얻는 것이 아니라, 아무도 알아주지 않는 상황에서도 자신의 몫을 묵묵히 감당할 수 있습니다. 인정받는 것과 사명으로 감당해야 할 일을 구별할 수 있는 힘이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "사역의 결과가 기대에 미치지 못하거나 다른 사람의 평가를 받는 상황을 가정해봅니다. 좋은 결과를 만들어 내가 유능한 사람이라는 것을 증명하고 싶은 마음이 얼마나 듭니까?", "opts": ["나는 언제나 내가 유능한 사람이라는 것을 증명하고 싶은 마음이 매우 강하다.", "좋은 결과를 내서 나의 능력을 인정받고 싶은 마음이 매우 크다.", "좋은 결과를 내고 인정받고 싶은 마음이 가끔 든다.", "사역의 결과를 통해 나의 유능함을 증명하고 싶은 마음이 거의 들지 않는다."], "fb": [["당신은 언제나 자신이 유능한 사람이라는 것을 증명하고 싶은 마음이 매우 강하다고 응답하셨습니다. 이렇게 되면 사역의 결과가 단순히 일을 잘했는지를 넘어, 자신의 능력과 가치를 증명하는 일이 될 수 있습니다. 결과가 좋으면 자신에 대한 확신이 커지지만, 기대에 미치지 못하면 자신의 능력까지 의심하게 될 수 있습니다. 그래서 좋은 결과를 만들어야 한다는 부담이 커지고, 다른 사람의 평가에도 민감하게 반응하게 될 수 있습니다. 결국 사역의 열매가 자신을 증명하는 기준이 되기 쉬워집니다. 지금 필요한 것은 좋은 결과를 포기하는 것이 아니라, 결과와 자신의 가치를 구별해서 바라보는 것입니다."], ["당신은 좋은 결과를 내서 자신의 능력을 인정받고 싶은 마음이 매우 크다고 응답하셨습니다. 이렇게 되면 사역의 결과가 자신의 능력을 보여주는 중요한 기준이 될 수 있습니다. 좋은 평가를 받을 때에는 자신이 잘하고 있다는 확신이 생기지만, 기대에 미치지 못하는 결과가 나오면 마음이 쉽게 흔들릴 수 있습니다. 그러다 보면 사역의 과정이나 자신의 실제 몫보다 결과와 평가에 더 많은 마음을 쓰게 될 수 있습니다. 지금 필요한 것은 인정받고 싶은 마음을 없애는 것이 아니라, 좋은 결과와 자신의 가치를 조금씩 구별해 보는 것입니다."], ["당신은 좋은 결과를 내고 인정받고 싶은 마음이 가끔 든다고 응답하셨습니다. 사역의 결과를 통해 인정받고 싶은 마음이 전혀 없는 것은 아니지만, 그 마음이 자신의 선택 전체를 결정할 정도로 크지는 않은 상태입니다. 좋은 결과를 바라고 다른 사람의 인정을 기뻐하면서도, 그것이 자신의 가치를 판단하는 유일한 기준이 되지는 않을 수 있습니다. 결과를 중요하게 여기면서도 그 결과와 자신의 존재 가치를 구별할 수 있는 균형이 잘 형성되어 있습니다."], ["당신은 사역의 결과를 통해 자신의 유능함을 증명하고 싶은 마음이 거의 들지 않는다고 응답하셨습니다. 좋은 결과를 만드는 것과 자신의 가치를 증명하는 것을 서로 다른 것으로 바라볼 수 있는 상태입니다. 결과가 좋으면 기뻐할 수 있지만, 결과가 기대에 미치지 못한다고 해서 자신의 능력이나 존재 가치까지 흔들리지는 않을 수 있습니다. 사역의 열매를 자신의 가치를 증명하기 위한 수단으로 삼기보다, 자신에게 맡겨진 몫을 충실하게 감당하는 데 집중할 수 있는 힘이 잘 자리 잡고 있습니다."]]}]}, {"id": "zayin", "label": "자인", "letter": "ז", "qTitle": "자인 · 갈등 속의 분별", "qSub": null, "intro": [], "items": [{"sub": null, "stem": "최근 들어 자신의 약점을 자주 발견하게 되는 상황입니다. 있는 모습 그대로 받아들여질 것 같지 않아서, 약한 모습을 사람들에게 보이는 것을 몹시 싫어한다고 가정해 봅니다. 당신은 어떻습니까?", "opts": ["몹시 불편해서 최대한 감추려고 한다.", "최대한 완벽하려고 한다.", "어느 정도는 노출하는 것이 편해진다.", "나는 있는 모습 그대로가 편하다."], "fb": [["당신은 자신의 약한 모습을 사람들에게 보이는 것이 몹시 불편해서 최대한 감추려고 한다고 응답하셨습니다. 이렇게 되면 자신의 부족한 부분이 드러날까 봐 사람들 앞에서는 괜찮은 모습만 보여주려고 할 수 있습니다. 약한 모습을 보이는 순간 자신이 낮게 평가되거나 받아들여지지 않을 것처럼 느껴질 수 있기 때문에, 도움이 필요할 때에도 혼자 감당하려 할 수 있습니다. 그러다 보면 다른 사람이 자신의 실제 모습을 알아가고 받아들일 수 있는 기회도 줄어들 수 있습니다. 지금 필요한 것은 약한 모습을 억지로 드러내는 것이 아니라, 왜 자신의 약한 모습을 보이는 것이 그렇게 불편한지 먼저 바라보는 것입니다."], ["당신은 약한 모습을 보이지 않기 위해 최대한 완벽하려고 한다고 응답하셨습니다. 이렇게 되면 부족한 부분이 드러나는 것을 막기 위해 일이나 관계에서 실수하지 않으려고 지나치게 자신을 관리하게 될 수 있습니다. 잘하고 있는 모습은 보여줄 수 있지만, 힘들거나 부족한 모습을 인정하는 일은 어려워질 수 있습니다. 그러다 보면 다른 사람에게 받아들여지는 자신과 실제 자신의 모습 사이에 차이가 커질 수 있습니다. 지금 필요한 것은 완벽하지 않은 모습을 일부러 드러내는 것이 아니라, 내가 왜 완벽해야만 안전하다고 느끼는지를 먼저 바라보는 것입니다."], ["당신은 자신의 약한 모습을 어느 정도는 다른 사람에게 보여주는 것이 편해진다고 응답하셨습니다. 자신의 부족한 부분을 모두 숨기기보다, 신뢰할 수 있는 관계에서는 있는 모습 그대로 자신을 보여줄 수 있는 힘이 생기고 있습니다. 약한 모습을 드러낸다고 해서 반드시 자신이 낮아지거나 관계가 깨지는 것은 아니라는 경험도 조금씩 쌓아가고 있습니다. 자신의 취약한 부분을 인정하면서도 관계 안에 머물 수 있다는 것은 자신과 다른 사람을 더 깊이 연결할 수 있는 중요한 힘입니다."], ["당신은 있는 모습 그대로가 편하다고 응답하셨습니다. 잘하는 모습뿐 아니라 부족하고 약한 모습까지도 자신의 일부로 받아들일 수 있는 상태입니다. 다른 사람에게 완벽한 모습을 보여주어야만 받아들여질 수 있다고 생각하지 않기 때문에, 자신의 모습을 지나치게 감추거나 꾸미지 않을 수 있습니다. 자신의 강점과 약점을 함께 인정하면서도 자신에 대한 편안함을 유지할 수 있는 힘이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "나의 약점을 지적하는 말을 듣는 상황입니다. 이때 나는 어떻게 대처합니까?", "opts": ["그 말이 틀렸다고 생각하고 상대의 잘못을 찾아 반박하고 싶어진다.", "상처를 받고 더 이상 약한 모습을 보이지 않으려 마음을 닫는다.", "불편하지만 그 말 속에 돌아볼 부분이 있는지도 살펴본다.", "받아들일 부분과 아닌 부분을 분별해서 구별할 수 있다."], "fb": [["당신은 자신의 약점을 지적하는 말을 들으면 그 말이 틀렸다고 생각하고 상대의 잘못을 찾아 반박하고 싶어진다고 응답하셨습니다. 이렇게 되면 자신의 모습을 돌아보기 전에 상대의 말에서 잘못된 부분을 찾아 자신을 방어하게 될 수 있습니다. 지적받는 순간 자신이 공격받고 있다고 느끼면, 그 말 안에 자신을 돌아볼 만한 내용이 있는지 살펴볼 여유를 잃을 수 있습니다. 그러다 보면 실제로 도움이 되는 말까지도 받아들이기 어려워질 수 있습니다. 지금 필요한 것은 상대의 말을 받아들이는 것이 아니라, 그 말을 들었을 때 내가 왜 그렇게 강하게 방어하고 싶어지는지를 먼저 바라보는 것입니다."], ["당신은 자신의 약점을 지적받으면 상처를 받고 더 이상 약한 모습을 보이지 않으려 마음을 닫는다고 응답하셨습니다. 이렇게 되면 한 번의 지적이 자신을 보호하기 위해 다른 사람에게 마음을 닫는 계기가 될 수 있습니다. 다시 약한 모습을 보였다가 상처받을까 봐 자신의 속마음이나 어려움을 감추게 될 수도 있습니다. 그러다 보면 자신을 이해하고 도울 수 있는 사람과도 깊이 연결되기 어려워질 수 있습니다. 지금 필요한 것은 그 상처를 빨리 극복하는 것이 아니라, 그 말이 왜 나에게 그렇게 깊은 상처가 되었는지와 무엇이 두려웠는지를 먼저 바라보는 것입니다."], ["당신은 자신의 약점을 지적하는 말이 불편하지만, 그 말 속에 돌아볼 부분이 있는지도 살펴본다고 응답하셨습니다. 지적을 바로 받아들이거나 거부하기보다, 불편한 마음을 느끼면서도 자신에게 해당되는 부분이 있는지 돌아볼 수 있습니다. 상대의 말이 모두 옳지는 않을 수 있다는 사실을 인정하면서도, 그 안에 자신에게 도움이 되는 내용이 있을 가능성까지 닫아버리지 않는 것입니다. 불편함을 견디면서 자신을 돌아볼 수 있다는 것은 자신의 모습을 보다 객관적으로 바라볼 수 있는 중요한 힘입니다."], ["당신은 자신의 약점을 지적하는 말을 들었을 때 받아들일 부분과 아닌 부분을 분별해서 구별할 수 있다고 응답하셨습니다. 상대의 말을 무조건 받아들이지도 않고, 불편하다는 이유로 모두 거부하지도 않으면서 자신에게 해당되는 부분을 살펴볼 수 있는 상태입니다. 상대의 평가와 자신의 실제 모습을 구별할 수 있기 때문에, 필요한 지적은 받아들이면서도 부당한 판단까지 자신의 것으로 만들지 않을 수 있습니다. 자신을 보호하면서도 자신을 돌아볼 수 있는 분별력이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "사람이나 상황을 판단할 때, 나도 모르게 '이쪽 아니면 저쪽'으로 딱 잘라 나누게 되는 경향이 있는지 돌아보는 상황입니다.", "opts": ["내 편인지 아닌지, 옳은지 그른지로 빠르게 나누고 그 판단을 쉽게 바꾸지 않는다.", "대체로 분명하게 나누어 보는 편이지만, 가끔 그 사이에 있는 경우도 있다는 것을 안다.", "둘 중 하나로만 보지 않으려 하고, 중간 지대가 있다는 것을 의식적으로 떠올린다.", "사람이나 상황을 나누기보다 여러 겹의 진실이 함께 있을 수 있다는 것을 자연스럽게 받아들인다."], "fb": [["당신은 사람이나 상황을 내 편인지 아닌지, 옳은지 그른지로 빠르게 나누고 그 판단을 쉽게 바꾸지 않는다고 응답하셨습니다. 이렇게 되면 복잡한 상황에서도 사람이나 사건을 빠르게 판단할 수 있지만, 처음 내린 판단과 다른 모습이 나타나도 그것을 받아들이기 어려울 수 있습니다. 한 사람 안에 여러 모습이 함께 있을 수 있다는 사실보다 내 편과 상대편이라는 구분이 먼저 보일 수 있습니다. 그러다 보면 나와 다른 사람을 이해할 수 있는 가능성이 줄어들고, 관계에서도 대립이 쉽게 커질 수 있습니다. 지금 필요한 것은 판단을 바꾸는 것이 아니라, 내가 왜 그렇게 빠르게 사람을 내 편과 아닌 편으로 나누게 되는지를 먼저 바라보는 것입니다."], ["당신은 사람이나 상황을 대체로 분명하게 나누어 보는 편이지만, 가끔 그 사이에 있는 경우도 있다는 것을 안다고 응답하셨습니다. 분명한 기준으로 상황을 판단하면서도 모든 경우가 반드시 어느 한쪽에만 속하는 것은 아니라는 사실을 알고 있습니다. 처음에는 옳고 그름이나 내 편과 아닌 편으로 판단하더라도, 다른 가능성이 있을 수 있다는 여지를 남겨둘 수 있습니다. 한 가지 기준만으로 사람과 상황을 결정하지 않고 다른 면을 바라볼 수 있는 힘이 조금씩 형성되고 있습니다."], ["당신은 사람이나 상황을 둘 중 하나로만 보지 않으려고 하며, 중간 지대가 있다는 것을 의식적으로 떠올린다고 응답하셨습니다. 분명한 판단을 내리고 싶은 마음이 생기더라도 그 사이에 다른 가능성이 있을 수 있음을 생각할 수 있습니다. 그래서 한 사람의 행동이나 한 사건만으로 전체를 판단하기보다, 그 안에 있는 여러 상황과 이유를 함께 살펴볼 수 있습니다. 서로 다른 면이 함께 존재할 수 있다는 것을 의식적으로 바라보는 힘이 잘 자라고 있습니다."], ["당신은 사람이나 상황을 단순하게 나누기보다 여러 겹의 진실이 함께 있을 수 있다는 것을 자연스럽게 받아들인다고 응답하셨습니다. 한 사람 안에 서로 다른 모습이 함께 있을 수 있고, 하나의 사건에도 여러 가지 이유와 의미가 있을 수 있다는 사실을 편안하게 받아들일 수 있는 상태입니다. 나와 다른 의견이나 행동을 곧바로 옳고 그름의 문제로 결정하지 않고, 그 안에 있는 여러 면을 함께 바라볼 수 있습니다. 하나의 판단에 자신을 가두지 않고 복잡한 현실을 있는 그대로 바라볼 수 있는 힘이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "내가 불편하게 느끼는 사람에게서 나와 비슷한 모습을 발견하는 상황입니다. 나는 어떻게 합니까?", "opts": ["그런 생각은 하지 않고 그 사람의 문제라고만 생각한다.", "그런 생각이 들어도 인정하기 싫고 나는 다르다고 생각한다.", "가끔 나에게도 비슷한 모습이 있을 수 있겠다고 생각해본다.", "내 안에 그런 모습이 있을 수 있음을 받아들이고 나를 돌아본다."], "fb": [["당신은 자신이 불편하게 느끼는 사람에게서 자신의 모습과 비슷한 부분을 발견하더라도 그것을 생각하지 않고, 그 사람의 문제라고만 생각한다고 응답하셨습니다. 이렇게 되면 상대에게서 불편함을 느끼는 이유를 자신의 모습과 연결해서 살펴보기보다, 문제의 원인을 상대에게만 두게 될 수 있습니다. 그러다 보면 상대의 행동에 대한 판단은 분명해지지만, 그 관계가 자신의 마음을 건드리는 이유를 이해하기 어려워질 수 있습니다. 자신에게도 돌아볼 부분이 있을 가능성을 보지 못하면, 비슷한 상황이 반복될 때마다 같은 불편함을 경험할 수도 있습니다. 지금 필요한 것은 상대의 문제를 해결하려는 것이 아니라, 왜 그 사람의 모습이 나에게 그렇게 불편하게 느껴지는지 먼저 바라보는 것입니다."], ["당신은 상대에게서 자신과 비슷한 모습을 발견해도 그것을 인정하기 싫고 자신은 다르다고 생각한다고 응답하셨습니다. 이렇게 되면 자신에게도 비슷한 부분이 있다는 것을 어느 정도 알아차리면서도, 그것을 받아들이는 순간 자신의 모습이 낮아지는 것처럼 느껴질 수 있습니다. 그래서 상대에게서 발견한 불편한 모습을 자신의 일부로 인정하기보다 계속해서 자신과 구별하려 할 수 있습니다. 그러다 보면 자신의 모습을 더 깊이 이해할 수 있는 기회를 놓칠 수 있습니다. 지금 필요한 것은 상대와 자신이 같다고 인정하는 것이 아니라, 왜 그 모습을 자신의 안에 있다고 인정하기 어려운지를 먼저 바라보는 것입니다."], ["당신은 자신이 불편하게 느끼는 사람을 보면서 가끔 자신에게도 비슷한 모습이 있을 수 있겠다고 생각한다고 응답하셨습니다. 상대의 모습을 곧바로 남의 문제로만 돌리지 않고, 그것이 자신의 모습과 연결될 가능성도 살펴볼 수 있는 상태입니다. 그렇다고 상대와 자신을 똑같다고 생각하는 것이 아니라, 누구에게나 자신이 보고 싶지 않은 모습이 있을 수 있음을 인정하는 것입니다. 다른 사람을 바라보는 과정에서 자신도 함께 돌아볼 수 있다는 것은 관계를 더 깊이 이해하는 중요한 힘이 될 수 있습니다."], ["당신은 불편하게 느끼는 사람에게서 발견한 모습을 자신의 안에도 있을 수 있다고 받아들이고 자신을 돌아본다고 응답하셨습니다. 다른 사람의 모습을 판단하는 데서 멈추지 않고, 그 모습을 통해 자신의 마음과 행동까지 살펴볼 수 있는 상태입니다. 상대와 자신이 똑같다고 생각하지 않으면서도, 자신 안에도 비슷한 모습이 어떤 형태로 존재할 수 있는지를 바라볼 수 있습니다. 불편한 관계나 감정을 자신을 이해하는 기회로 바꾸어 바라볼 수 있는 힘이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "나와 다른 의견을 가지고 있거나 내 뜻과 다르게 행동하는 사람과 함께 사역하는 상황을 가정해봅니다. 그런 사람을 만나면 적대적인 마음이 얼마나 생깁니까?", "opts": ["상대를 밀어내거나 맞서고 싶을 만큼 강한 적대감이 생긴다.", "상대에 대한 거부감이나 적대감이 오래 남는다.", "순간적으로 불편하거나 거슬리는 마음이 생긴다.", "적대적인 마음이 거의 생기지 않는다."], "fb": [["당신은 자신과 다른 의견을 가지고 있거나 뜻과 다르게 행동하는 사람을 만나면 상대를 밀어내거나 맞서고 싶을 만큼 강한 적대감이 생긴다고 응답하셨습니다. 이렇게 되면 다른 사람의 차이가 단순한 의견의 차이를 넘어 자신을 위협하는 것처럼 느껴질 수 있습니다. 그래서 함께 사역해야 하는 상황에서도 상대를 이해하기보다 먼저 밀어내거나 맞서려는 마음이 강해질 수 있습니다. 적대감이 커질수록 상대의 다른 모습을 있는 그대로 바라보거나 함께 일할 수 있는 가능성도 줄어들 수 있습니다. 지금 필요한 것은 상대에게 다가가는 것이 아니라, 그 사람을 밀어내고 싶을 만큼 내가 무엇을 위협받고 있다고 느끼는지 먼저 바라보는 것입니다."], ["당신은 자신과 다른 의견이나 행동을 하는 사람에게 느낀 거부감이나 적대감이 오래 남는다고 응답하셨습니다. 이렇게 되면 실제 상황은 지나갔더라도 상대에 대한 불편한 감정이 마음에 오래 남아 이후의 관계에도 영향을 줄 수 있습니다. 상대의 한 가지 행동이나 의견이 그 사람 전체를 바라보는 기준이 되면서, 함께 일해야 하는 상황에서도 마음의 거리가 쉽게 좁혀지지 않을 수 있습니다. 그러다 보면 서로 다른 점을 조정하기보다 그 사람 자체를 받아들이기 어려워질 수 있습니다. 지금 필요한 것은 그 사람에 대한 감정을 없애는 것이 아니라, 그 사람의 어떤 모습이 내 안에서 이렇게 오래 거부감을 일으키는지 먼저 바라보는 것입니다."], ["당신은 자신과 다른 의견이나 행동을 하는 사람을 만나면 순간적으로 불편하거나 거슬리는 마음이 생긴다고 응답하셨습니다. 서로 다르기 때문에 불편한 마음이 생길 수 있다는 사실을 자연스럽게 경험하면서도, 그 감정이 오래 지속되거나 관계 전체를 결정하도록 내버려두지는 않을 수 있습니다. 상대와 생각이 다르다는 사실과 그 사람을 받아들이는 일을 구별할 수 있기 때문에, 불편함이 있어도 함께 사역해야 할 자신의 몫을 바라볼 수 있습니다. 다른 사람의 차이를 인정하면서 자신의 감정도 함께 다룰 수 있는 균형이 잘 형성되어 있습니다."], ["당신은 자신과 다른 의견을 가지고 있거나 뜻과 다르게 행동하는 사람을 만나도 적대적인 마음이 거의 생기지 않는다고 응답하셨습니다. 다른 사람의 차이를 자신의 자리를 위협하는 것으로 받아들이기보다, 서로 다를 수 있는 자연스러운 차이로 바라볼 수 있는 상태입니다. 의견이 다르거나 방식이 달라도 상대를 밀어내지 않고 자신의 몫을 감당하면서 함께할 수 있습니다. 나와 다른 사람을 적으로 만들지 않고 차이를 있는 그대로 받아들일 수 있는 힘이 잘 자리 잡고 있습니다."]]}]}, {"id": "tet", "label": "테트", "letter": "ט", "qTitle": "테트 · 아직 여물지 않은 시간", "qSub": null, "intro": [], "items": [{"sub": null, "stem": "충분히 준비됐다고 생각하는데도 기회가 주어지지 않는 상황입니다. 나는 어떻게 반응합니까?", "opts": ["마땅히 받아야 할 것을 못 받고 있다고 생각하며 원망이 커진다.", "왜 인정받지 못하는지 이유를 찾으며 상황을 바꾸고 싶어진다.", "아직 내가 모르는 이유가 있을 수 있다고 생각하며 돌아본다.", "자격을 갖췄다는 생각과 별개로 더 자라야 할 것을 살핀다."], "fb": [["당신은 충분히 준비했다고 생각하는데도 기회가 주어지지 않으면, 마땅히 받아야 할 것을 받지 못하고 있다고 생각하며 원망이 커진다고 응답하셨습니다. 충분히 노력하고 준비했다는 확신이 클수록, 기회가 주어지지 않는 현실은 단순한 지연이 아니라 부당한 대우처럼 느껴질 수 있습니다. 그래서 ‘나는 이 정도는 받아야 한다’는 생각이 강해지고, 현실이나 사람에 대한 원망으로 마음이 기울 수 있습니다. 이 상태가 오래되면 아직 드러나지 않은 이유보다 ‘왜 나에게 주어지지 않는가’라는 억울함에 마음이 머물기 쉽습니다. 지금의 어려움은 준비가 부족해서라기보다, 준비한 만큼 결과가 따라와야 한다는 기대가 현실과 부딪히고 있다는 데 있습니다."], ["당신은 충분히 준비했다고 생각하는데도 기회가 주어지지 않으면, 왜 인정받지 못하는지 이유를 찾으며 상황을 바꾸고 싶어진다고 응답하셨습니다. 현실이 기대와 다를 때 원인을 찾아 해결하려는 힘이 강한 편입니다. 하지만 모든 상황이 노력이나 방법을 바꾼다고 바로 달라지는 것은 아니기 때문에, 계속해서 원인을 찾고 방법을 바꾸다 보면 자신도 모르게 현실을 통제하려는 부담이 커질 수 있습니다. 결국 ‘무엇을 더 해야 하는가’에 집중하면서 지금의 상황을 있는 그대로 받아들이기 어려워질 수 있습니다. 이 상태에서는 능력이나 노력의 문제가 아니라, 내가 바꿀 수 없는 현실까지 바꾸려 할 때 피로가 커집니다."], ["당신은 충분히 준비했다고 생각해도 아직 자신이 모르는 이유가 있을 수 있다고 생각하며 돌아본다고 응답하셨습니다. 자신의 준비와 노력을 인정하면서도 결과가 다르게 나타날 수 있다는 사실을 받아들일 수 있습니다. 기회가 주어지지 않았다는 사실을 곧바로 부당함이나 실패로 해석하지 않기 때문에, 현실에 대한 원망에 쉽게 머물지 않을 수 있습니다. 자신의 기준을 지키면서도 자신이 모든 이유를 알고 있는 것은 아니라는 사실을 인정할 수 있는 힘이 있습니다."], ["당신은 자격을 갖췄다는 생각과 별개로 더 자라야 할 것을 살핀다고 응답하셨습니다. 이미 충분히 준비했다는 생각에 머물지 않고, 현실의 결과를 통해 아직 성장할 부분이 있을 수 있음을 받아들이는 상태입니다. 기회를 얻지 못한 경험을 자신의 가치에 대한 거절로 받아들이기보다, 자신의 과정 안에 있는 하나의 경험으로 이해할 수 있습니다. ‘나는 충분히 했다’와 ‘나는 아직 성장할 수 있다’를 동시에 가질 수 있는 균형이 잘 형성되어 있습니다."]]}, {"sub": null, "stem": "내가 믿어온 생각과 실제 현실이 다르다는 것을 알게 된 상황입니다. 좌절감과 무력감이 밀려올 때, 나는 어떻게 합니까?", "opts": ["현실이 내가 믿어온 것과 달리 잘못되었다고 생각하니 좌절되고 무력감이 들어서 더 강하게 붙잡게 된다.", "현실이 내가 믿어온 것과 달리 잘못되었다고 생각하니 좌절되고 무력감이 들어서 이전 방식으로 그대로 돌아가고 싶어진다.", "현실이 내가 믿어온 것과 달리 잘못되었다고 생각하니 좌절되고 무력감이 들지만 차이를 인정하고 그것을 이해해 보려 한다.", "현실이 내가 믿어온 것과 다르다고 잘못된 것이라는 결론을 서두르지 않고 그 차이가 주는 의미를 살핀다."], "fb": [["당신은 내가 믿어온 생각과 현실이 다를 때, 현실이 잘못되었다고 생각하면서 좌절과 무력감을 느끼고 오히려 이전의 믿음을 더 강하게 붙잡는다고 응답하셨습니다. 오랫동안 믿어온 생각이 현실과 충돌하면, 현실을 새롭게 이해하기보다 내가 믿어온 것이 맞다는 확신을 더 강하게 붙잡게 될 수 있습니다. 그렇게 되면 현실이 보여주는 새로운 사실보다 기존의 믿음을 지키는 일이 더 중요해질 수 있습니다. 결국 현실을 이해하기 위한 믿음이 오히려 현실을 받아들이지 못하게 만드는 틀이 될 수도 있습니다. 지금의 좌절은 단순히 현실이 마음에 들지 않아서가 아니라, 내가 옳다고 믿어온 것과 실제 현실이 충돌하면서 생기는 혼란에서 비롯될 수 있습니다."], ["당신은 내가 믿어온 생각과 현실이 다를 때, 좌절과 무력감을 느끼면서 이전 방식으로 그대로 돌아가고 싶어진다고 응답하셨습니다. 익숙한 방식은 현실이 낯설어졌을 때 자신을 붙잡아주는 안전한 기준이 될 수 있습니다. 그러나 현실이 이미 달라졌는데 이전 방식으로 돌아가면, 과거에는 효과가 있었던 방법이 지금은 맞지 않을 수도 있습니다. 그래서 다시 같은 방법을 사용하면서도 원하는 결과가 나오지 않는 경험을 반복할 수 있습니다. 이때 나타나는 무력감은 능력이 부족해서라기보다, 달라진 현실에 이전의 기준을 그대로 적용하고 있기 때문에 커질 수 있습니다."], ["당신은 내가 믿어온 생각과 현실이 다를 때 좌절과 무력감이 들지만, 그 차이를 인정하고 이해해 보려 한다고 응답하셨습니다. 자신이 믿어온 것을 쉽게 버리지 않으면서도 현실이 보여주는 다른 모습을 인정할 수 있습니다. 기대와 현실이 다르다는 사실을 곧바로 실패나 오류로 판단하지 않기 때문에, 새로운 사실을 받아들일 공간이 남아 있습니다. 자신이 믿어온 것과 현실 중 하나를 반드시 버려야 한다고 생각하지 않고, 그 차이 속에서 더 넓은 이해를 만들어갈 수 있는 힘이 있습니다."], ["당신은 내가 믿어온 생각과 현실이 다르다고 해서 곧바로 현실이 잘못되었다고 결론내리지 않고, 그 차이가 주는 의미를 살핀다고 응답하셨습니다. 자신의 믿음과 현실이 다를 수 있다는 사실을 자연스럽게 받아들일 수 있는 상태입니다. 현실을 기존의 생각에 억지로 맞추기보다, 새로운 현실이 무엇을 보여주는지 차분하게 이해할 수 있습니다. 자신이 알고 있던 세계가 흔들릴 때에도 그 흔들림을 새로운 이해의 기회로 받아들일 수 있는 힘이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "내가 믿었던 사람에게 배신을 당한 상황입니다. 그 상황에서 분노는 어느 정도로 커집니까?", "opts": ["강한 분노가 치밀어 올라 그 사람을 향한 마음을 쉽게 가라앉히기 어렵다.", "분노가 크게 일고 한동안 그 일이 마음에서 떠나지 않는다.", "화가 나지만, 최근에는 비교적 빠르게 가라앉는 편이다.", "분노보다는 아쉬움이나 안타까움이 먼저 든다."], "fb": [["당신은 믿었던 사람에게 배신을 당하면 강한 분노가 치밀어 올라 그 사람을 향한 마음을 쉽게 가라앉히기 어렵다고 응답하셨습니다. 믿었던 사람이었기 때문에 배신은 단순한 실망을 넘어 ‘내가 믿었던 것이 무너졌다’는 경험으로 느껴질 수 있습니다. 그래서 분노가 상대의 행동을 향하는 데서 그치지 않고, 관계 전체와 자신이 했던 선택까지 흔들 수 있습니다. 마음속에서 그 일이 계속 반복되면서 현재의 관계까지 영향을 받을 가능성도 있습니다. 이때의 분노는 단순히 화를 잘 내는 문제가 아니라, 무너진 신뢰와 상실감이 강한 분노로 나타나는 상태에 가깝습니다."], ["당신은 믿었던 사람에게 배신을 당하면 분노가 크게 일고 한동안 그 일이 마음에서 떠나지 않는다고 응답하셨습니다. 배신의 경험이 쉽게 지나가지 않고 마음에 오래 남는 편입니다. 믿음이 컸던 만큼 실망도 크기 때문에, 당시의 말이나 행동을 반복해서 떠올리거나 ‘왜 그런 일이 일어났을까’를 계속 생각하게 될 수 있습니다. 그러다 보면 이미 지나간 사건이 현재의 관계와 감정까지 계속 영향을 줄 수 있습니다. 지금의 반응에는 배신에 대한 분노뿐 아니라, 믿었던 관계가 무너졌다는 깊은 실망도 함께 들어 있을 수 있습니다."], ["당신은 믿었던 사람에게 배신을 당하면 화가 나지만, 최근에는 비교적 빠르게 가라앉는 편이라고 응답하셨습니다. 배신을 당했을 때 화가 나는 것은 자연스러운 반응이지만, 그 감정이 자신의 마음 전체를 오래 지배하지는 않는 상태입니다. 상처와 분노를 경험하면서도 그 사건과 현재의 자신을 구별할 수 있기 때문에, 한 번의 배신이 이후의 모든 관계에 영향을 미치도록 하지는 않을 수 있습니다. 상처를 경험하더라도 감정에서 다시 빠져나올 수 있는 힘이 있습니다."], ["당신은 믿었던 사람에게 배신을 당했을 때 분노보다는 아쉬움이나 안타까움이 먼저 든다고 응답하셨습니다. 배신의 잘못을 느끼면서도 상대에 대한 분노에만 머물지 않고, 그 관계가 그렇게 되었다는 사실 자체를 안타깝게 받아들일 수 있는 상태입니다. 그래서 상대를 단순히 가해자와 피해자의 구도로만 바라보기보다, 관계 전체에서 일어난 일을 볼 수 있습니다. 상처를 받았으면서도 분노에 자신을 맡기지 않고 더 넓은 시선으로 관계를 바라볼 수 있는 힘이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "내 능력이나 가치를 다른 사람에게 증명하지 못하는 상황입니다. 나는 나 자신을 어떻게 봅니까?", "opts": ["능력이나 가치를 증명하지 못하면 나는 가치 없는 사람처럼 느껴진다.", "사람들이 알아주지 않으면 내가 중요하지 않은 사람이라는 생각이 든다.", "인정받지 못해도 그것이 나의 가치를 결정하는 절대 조건은 아니라고 생각한다.", "증명하거나 인정받지 못해도 지금의 나를 있는 그대로 바라볼 수 있다."], "fb": [["당신은 능력이나 가치를 증명하지 못하면 자신이 가치 없는 사람처럼 느껴진다고 응답하셨습니다. 이 경우 사역의 결과나 자신의 능력이 단순한 성과가 아니라 자기 존재의 가치까지 증명하는 기준이 될 수 있습니다. 그래서 일이 잘되지 않거나 능력을 인정받지 못하면 ‘이번 일이 잘되지 않았다’에서 끝나지 않고 ‘나는 가치가 없다’는 생각으로 이어질 수 있습니다. 그러면 더 좋은 결과를 만들어 자신의 가치를 다시 증명해야 한다는 압박도 커질 수 있습니다. 지금 흔들리는 것은 능력만이 아니라, 결과와 자기 가치가 너무 밀접하게 연결되어 있다는 점입니다."], ["당신은 사람들이 알아주지 않으면 자신이 중요하지 않은 사람이라는 생각이 든다고 응답하셨습니다. 다른 사람의 인정이 자신의 중요함을 확인하는 중요한 기준이 되어 있는 상태입니다. 그래서 많은 일을 하고도 알아주는 사람이 없으면 수고의 의미까지 작아진 것처럼 느껴질 수 있습니다. 반대로 인정받는 순간에는 자신이 중요한 사람이라는 느낌을 다시 얻을 수 있기 때문에, 자신의 마음이 타인의 반응에 따라 크게 흔들릴 수 있습니다. 이 경우 어려운 것은 인정받고 싶은 마음 자체보다, 타인의 인정이 자신의 중요함을 결정하는 기준이 되기 쉽다는 점입니다."], ["당신은 인정받지 못해도 그것이 자신의 가치를 결정하는 절대 조건은 아니라고 생각한다고 응답하셨습니다. 다른 사람의 평가와 자신의 가치를 어느 정도 분리해서 바라볼 수 있는 상태입니다. 인정받으면 기쁘고 인정받지 못하면 아쉬울 수 있지만, 그 결과가 자신의 존재 가치 전체를 결정한다고 생각하지는 않습니다. 그래서 외부의 평가가 기대와 달라도 자신의 기준을 완전히 잃지는 않을 수 있습니다."], ["당신은 증명하거나 인정받지 못해도 지금의 자신을 있는 그대로 바라볼 수 있다고 응답하셨습니다. 능력이나 성과를 보여주지 않아도 자신의 가치를 의심하지 않을 수 있는 상태입니다. 다른 사람이 알아주는 것과 내가 누구인지를 분리할 수 있기 때문에, 결과가 좋지 않거나 인정받지 못하는 순간에도 자신을 낮추어 판단하지 않습니다. 성과는 변할 수 있지만 자신의 가치까지 함께 변하는 것은 아니라는 기준이 잘 자리 잡고 있습니다."]]}, {"sub": null, "stem": "오랫동안 노력하고 있지만 상황이 기대한 만큼 달라지지 않는 상황을 가정해봅니다. 아무리 애써도 상황이 달라지지 않을 때 분노와 무력감을 얼마나 느낍니까?", "opts": ["강한 분노와 무력감에 사로잡힌다.", "화가 나고 무기력한 마음이 크게 든다.", "답답하고 화가 나는 마음이 잠시 생긴다.", "분노와 무력감을 거의 느끼지 않는다."], "fb": [["당신은 오랫동안 노력해도 상황이 달라지지 않으면 강한 분노와 무력감에 사로잡힌다고 응답하셨습니다. 충분히 노력했는데도 현실이 움직이지 않으면 ‘더 이상 내가 할 수 있는 것이 없다’는 느낌이 강해질 수 있습니다. 이때 분노는 노력에 대한 보상이 없다는 억울함에서 생기고, 무력감은 아무리 애써도 결과를 바꿀 수 없다는 경험에서 생길 수 있습니다. 두 감정이 함께 커지면 다시 시도할 힘마저 떨어질 수 있습니다. 지금의 핵심은 노력의 부족이 아니라, 노력과 결과가 연결되지 않는 현실을 견디기 어려운 상태에 있습니다."], ["당신은 오랫동안 노력해도 상황이 달라지지 않으면 화가 나고 무기력한 마음이 크게 든다고 응답하셨습니다. 계속 애쓰고 있는데 변화가 보이지 않으면 자신의 노력이 아무 의미가 없는 것처럼 느껴질 수 있습니다. 그래서 한편으로는 더 애써야 한다고 생각하면서도, 다른 한편으로는 아무것도 하고 싶지 않은 마음이 생길 수 있습니다. 오래 지속되면 노력 자체가 부담으로 느껴지고, 결과를 기대하는 것조차 지치게 만들 수 있습니다. 지금의 무기력은 게으름이라기보다, 오랜 노력에도 현실이 달라지지 않은 데서 쌓인 피로와 실망에 가깝습니다."], ["당신은 오랫동안 노력해도 상황이 달라지지 않으면 답답하고 화가 나는 마음이 잠시 생기지만 가라앉는다고 응답하셨습니다. 노력했는데 결과가 없을 때 답답함을 느끼는 것은 자연스러운 반응이지만, 그 감정이 오래 자신을 붙잡지는 않는 상태입니다. 현실이 기대와 다르다는 사실과 자신의 가치를 구별할 수 있기 때문에, 결과가 늦어져도 마음 전체가 무너지지는 않을 수 있습니다. 노력과 결과 사이에 시간이 필요할 수 있다는 사실을 견딜 수 있는 힘이 있습니다."], ["당신은 오랫동안 노력해도 상황이 달라지지 않을 때 분노와 무력감을 거의 느끼지 않는다고 응답하셨습니다. 노력한 만큼 즉시 결과가 나타나야 한다는 생각에서 비교적 자유로운 상태입니다. 상황이 달라지지 않더라도 그것을 자신의 실패나 가치의 문제로 확대하지 않기 때문에, 결과가 늦어지는 시간을 비교적 안정적으로 견딜 수 있습니다. 내가 할 수 있는 것과 내가 통제할 수 없는 것을 구별하면서 현실을 받아들일 수 있는 힘이 잘 자리 잡고 있습니다."]]}]}, {"id": "yod", "label": "요드", "letter": "י", "qTitle": "요드 · 시간이 지나며 달라지는 의미", "qSub": null, "intro": [], "items": [{"sub": null, "stem": "언제부터인지 어떤 계기로 동적인 모습에서 정적으로 바뀌기 시작한 상황입니다. 그 변화를 나는 어떻게 받아들입니까?", "opts": ["활동을 멈추면 뒤처지는 것 같아 계속 무언가를 하고 있어야 마음이 놓인다.", "활동을 줄이고 내면성찰 시간을 가져야 하는 것은 알지만 막상 손을 놓기가 쉽지 않다.", "눈에 보이는 성과를 좇던 리듬에서 조금씩 벗어나려 하고 있다.", "드러나는 활동과 성과에서 의도적으로 물러나 이제는 다른 리듬으로 살아가고 있다."], "fb": [["당신은 활동을 멈추면 뒤처지는 것 같아 계속 무언가를 하고 있어야 마음이 놓인다고 응답하셨습니다. 지금까지 당신에게 움직이고 성과를 내는 일은 단순한 활동이 아니라 자신이 살아 있고 필요한 사람이라는 것을 확인하는 중요한 방식이었을 수 있습니다. 그래서 멈추면 쉬는 것이 아니라 뒤처지는 것처럼 느껴지고, 아무것도 하지 않는 시간이 오히려 불안을 만들어낼 수 있습니다.", "하지만 발효는 바로 이 지점에서 시작됩니다. 밖으로 더 많은 결과를 만들어내는 대신, 지금까지의 경험과 감정이 내면에서 움직일 수 있도록 잠시 머무는 시간이 필요합니다. 아직은 멈춤이 편하지 않더라도, 계속 바깥으로만 움직이면 내 안에서 무엇이 변하고 있는지 알아차리기 어렵습니다. 지금 당신에게 필요한 것은 더 많은 성과가 아니라, 성과가 잠시 멈춘 자리에서 내면의 변화가 시작될 수 있다는 사실을 이해하는 것입니다."], ["당신은 활동을 줄이고 내면성찰의 시간을 가져야 하는 것은 알지만, 막상 손을 놓기가 쉽지 않다고 응답하셨습니다. 이미 자신에게 새로운 시간이 필요하다는 사실은 알고 있지만, 오랫동안 익숙했던 활동의 리듬을 실제로 내려놓는 것은 아직 어렵습니다. 해야 할 일을 멈추면 마음이 허전하거나 불안해지고, 다시 무언가를 시작해야 할 것처럼 느껴질 수 있습니다.", "이 단계에서 중요한 것은 활동을 모두 포기하는 것이 아닙니다. 바깥의 활동을 줄인 자리에 내면의 움직임이 시작될 수 있다는 것을 경험하는 것입니다. 발효는 아무것도 하지 않는 공백이 아니라, 그동안 경험했던 고난과 실패, 감정과 생각이 안에서 새로운 의미로 변화하기 시작하는 시간입니다. 아직 손을 놓기 어렵다는 것은 오랫동안 바깥의 활동에 맞추어 살아온 리듬이 강하게 남아 있다는 뜻이며, 이제 다른 리듬으로 넘어가는 문턱에 서 있다는 의미이기도 합니다."], ["당신은 눈에 보이는 성과를 좇던 리듬에서 조금씩 벗어나려 하고 있다고 응답하셨습니다. 지금까지 무엇을 이루었는가를 중요하게 여기던 삶에서, 자신의 안에서 무엇이 일어나고 있는지도 중요하게 보기 시작한 상태입니다. 활동을 줄이는 것이 단순한 휴식이 아니라 자신의 삶을 다른 방식으로 이해하기 시작하는 변화가 되고 있습니다.", "이것이 발효가 시작되는 지점입니다. 지나온 경험이 아직 완전히 정리되지 않았더라도, 그것을 다시 바라볼 수 있는 내면의 공간이 생기고 있습니다. 바깥의 결과가 줄어드는 동안 내면에서는 새로운 의미가 자라기 시작할 수 있습니다."], ["당신은 드러나는 활동과 성과에서 의도적으로 물러나 이제는 다른 리듬으로 살아가고 있다고 응답하셨습니다. 계속해서 무엇인가를 증명하고 만들어내는 삶에서 한 걸음 물러나, 자신의 내면에서 일어나는 변화에 시간을 줄 수 있는 상태입니다.", "이제 당신에게 중요한 것은 ‘얼마나 많이 했는가’가 아니라 그동안 살아온 경험이 내 안에서 무엇으로 변화되고 있는가입니다. 발효는 바로 이 시간을 통해 일어납니다. 지나온 고난과 경험이 단순한 기억으로 남는 것이 아니라 새로운 의미와 방향으로 바뀌면서, 아직 보이지 않았던 것이 서서히 모습을 드러내기 시작합니다. 당신은 이미 바깥의 성과에서 내면의 변화로 중심을 옮길 수 있는 자리에 와 있습니다."]]}, {"sub": null, "stem": "지난 시간의 고난을 다시 떠올리는 상황입니다. 나는 그 일을 어떻게 바라봅니까?", "opts": ["지금도 지난 시간의 고난은 억울하고 손해 본 일로, 실패였다고 생각한다.", "그 일에 다른 의미가 있을 수도 있다고 생각하지만, 쉽게 받아들이기는 어렵다.", "처음엔 화가 났지만 이제는 다른 의미로 그 일을 바라보기 시작하는 것 같다.", "이제는 그 일이 나를 성장시키기 위해서 온 일이라는 생각이 든다."], "fb": [["당신은 지난 시간의 고난을 지금도 억울하고 손해 본 일이며 실패였다고 생각한다고 응답하셨습니다. 그 시간에 무엇을 잃었는지가 너무 크게 남아 있기 때문에, 그 경험이 현재의 자신에게 무엇을 남겼는지는 아직 잘 보이지 않는 상태입니다. 과거의 고난은 지나갔지만 마음속에서는 여전히 ‘왜 내가 이런 일을 겪어야 했는가’라는 질문이 남아 있을 수 있습니다.", "발효는 고난을 좋은 일이라고 억지로 해석하는 것이 아닙니다. 처음에는 실패와 손해로만 보였던 경험이 시간이 지나면서 다른 의미를 만들어내는 과정입니다. 지금은 아직 그 경험의 의미가 충분히 변하지 않은 상태이므로, 과거를 단순한 손실로 느끼는 것은 자연스러운 반응입니다."], ["당신은 그 일에 다른 의미가 있을 수도 있다고 생각하지만 쉽게 받아들이기는 어렵다고 응답하셨습니다. 과거의 고난을 단순한 손실로만 보지는 않지만, 그렇다고 그것을 의미 있는 경험이라고 쉽게 말하기도 어려운 상태입니다. 당시의 아픔과 억울함은 여전히 남아 있고, 동시에 그 안에서 무엇인가를 배웠을 가능성도 보이기 시작합니다.", "이것이 발효가 시작되는 모습입니다. 고난의 의미를 서둘러 결정하지 않고, 서로 다른 감정과 생각이 내면에서 함께 머무를 수 있게 되는 것입니다. 처음에는 모순처럼 보였던 경험이 시간이 지나면서 새로운 의미로 변화할 수 있습니다."], ["당신은 처음에는 화가 났지만 이제는 다른 의미로 그 일을 바라보기 시작하는 것 같다고 응답하셨습니다. 과거의 사건을 처음 경험했을 때의 감정만으로 판단하지 않고, 시간이 지난 지금 그 경험이 자신에게 남긴 것을 새롭게 보기 시작하고 있습니다.", "발효가 진행되면 바로 이런 변화가 나타납니다. 사건 자체가 달라지는 것은 아니지만 그 사건을 이해하는 나의 시선이 달라집니다. 그래서 과거의 고난은 더 이상 단순히 견뎌야 했던 일이 아니라, 지금의 자신을 변화시킨 과정으로 조금씩 의미가 바뀌기 시작합니다."], ["당신은 이제 그 일이 자신을 성장시키기 위해서 온 일이라는 생각이 든다고 응답하셨습니다. 지나온 고난을 단순한 실패나 손실로만 보지 않고, 그 시간을 통해 자신이 달라졌다는 사실을 받아들이고 있습니다. 고통이 좋았다는 뜻이 아니라, 고통을 지나온 결과 자신에게 새로운 변화가 생겼다는 뜻입니다.", "이것은 발효가 깊어지면서 과거의 경험이 새로운 의미로 전환되고 있는 상태입니다. 이제 중요한 것은 그 고난을 계속 설명하는 것이 아니라, 그 경험을 통해 새롭게 생겨난 자신이 무엇인지 알아가는 것입니다."]]}, {"sub": null, "stem": "지나온 시간이 지금의 나에게 남긴 의미를 봅니다.", "opts": ["의미 없이 지나간 시간이며, 누군가의 방해나 잘못 때문에 겪은 억울한 시간이라고 생각한다.", "힘들고 아까운 시간이었지만, 그 안에서 내가 배운 것도 있었다고 생각한다.", "지금 돌아보면 그 시간이 나를 변화시키거나 새로운 방향을 찾게 한 의미가 있었다고 생각한다.", "그 고통의 시간 덕분에 지금의 내가 있게 된 것 같다."], "fb": [["당신은 지나온 시간이 의미 없이 지나간 시간이며, 누군가의 방해나 잘못 때문에 겪은 억울한 시간이라고 생각한다고 응답하셨습니다. 과거를 떠올릴 때 그 시간이 자신에게 무엇을 남겼는가보다 무엇을 빼앗아갔는지가 먼저 보이는 상태입니다. 그래서 현재의 자신을 이해할 때도 과거의 억울함이 중요한 기준이 될 수 있습니다.", "이 단계에서는 아직 그 경험이 내면에서 새로운 의미로 충분히 변화되지 않은 것입니다. 발효가 시작되기 위해서는 과거를 좋은 경험으로 바꾸어 생각할 필요는 없지만, 그 시간이 현재의 나에게 무엇을 남겼는지 볼 수 있는 공간이 생겨야 합니다."], ["당신은 힘들고 아까운 시간이었지만, 그 안에서 자신이 배운 것도 있었다고 응답하셨습니다. 잃어버린 것과 얻은 것을 동시에 볼 수 있게 되면서 과거의 경험이 조금씩 다른 의미를 갖기 시작하고 있습니다. 그 시간을 좋았던 일이라고 미화하지 않으면서도, 그 안에서 자신의 변화와 배움을 발견하고 있습니다.", "이것은 발효가 진행되는 중요한 변화입니다. 고난이 사라지는 것이 아니라 고난에 대한 이해가 달라지는 것입니다. 지나온 시간이 단순히 빼앗긴 시간이 아니라 현재의 자신을 만드는 데 무엇인가를 남긴 시간이 되어가고 있습니다."], ["당신은 지금 돌아보면 그 시간이 자신을 변화시키거나 새로운 방향을 찾게 한 의미가 있었다고 응답하셨습니다. 지나온 경험이 현재의 생각과 선택에 영향을 주었다는 사실을 볼 수 있게 되었습니다. 당시에는 알지 못했던 의미가 시간이 지나면서 드러나고 있는 것입니다.", "발효가 깊어지면 과거의 경험은 단순한 기억이 아니라 현재의 삶을 움직이는 새로운 의미가 됩니다. 이제 지나온 시간을 이해하는 데서 한 걸음 더 나아가, 그 경험을 통해 무엇이 새롭게 생겨났는지를 볼 수 있는 단계에 들어서고 있습니다."], ["당신은 그 고통의 시간 덕분에 지금의 내가 있게 된 것 같다고 응답하셨습니다. 지나온 고통을 자신의 삶에서 떼어내어 ‘없었어야 할 시간’으로만 생각하지 않고, 그 시간을 통과하면서 지금의 자신이 만들어졌다는 사실을 받아들일 수 있습니다.", "이것은 발효가 충분히 진행되어 과거의 경험이 현재의 정체성과 새로운 방향 안으로 통합되고 있는 상태입니다. 이제 과거를 계속 해석하는 것보다, 그 경험을 통해 만들어진 새로운 자신이 무엇을 향하고 있는지를 발견하는 일이 중요해집니다."]]}, {"sub": null, "stem": "지나온 힘든 일이 어느 날 갑자기 이해되거나 깨달아진 경험을 돌아보는 상황입니다. 그런 경험이 있습니까?", "opts": ["지난 일은 여전히 이해되지 않고, 떠올리면 답답하기만 하다.", "이해하려고 애써 보았지만, 아직 깨달아진 것은 없다.", "애쓰지 않았는데 어느 날 문득 그 일이 이해된 적이 있다.", "그렇게 문득 이해된 일이 여러 번 있었고, 그때마다 그 일을 바라보는 내 마음이 달라졌다."], "fb": [["당신은 지난 일이 여전히 이해되지 않고, 떠올리면 답답하기만 하다고 응답하셨습니다. 그 일이 왜 일어났는지, 나에게 무슨 의미가 있는지 아직 보이지 않기 때문에 떠올릴 때마다 같은 답답함이 되풀이될 수 있습니다.", "발효는 억지로 의미를 찾아낸다고 일어나는 것이 아닙니다. 시간이 지나며 저절로 피어나는 것처럼, 이해도 어느 순간 찾아옵니다. 지금 이해되지 않는다는 것은 그 일이 아직 내 안에서 익어 가는 중이라는 뜻일 수 있습니다. 지금 필요한 것은 답을 서둘러 만드는 것이 아니라, 이해되지 않는 채로 그 일을 잠시 내 안에 두어 보는 것입니다."], ["당신은 이해하려고 애써 보았지만, 아직 깨달아진 것은 없다고 응답하셨습니다. 지난 일을 외면하지 않고 그 의미를 찾으려 애써 왔다는 것 자체가 이미 마음이 그 일을 향해 열려 있다는 뜻입니다.", "다만 발효에서 오는 이해는 애쓴 만큼 바로 주어지지 않을 때가 많습니다. 생각으로 붙잡으려 할수록 더 멀어지다가, 오히려 애쓰기를 멈춘 어느 날 문득 찾아오기도 합니다. 지금은 답을 찾으려는 수고를 조금 내려놓고, 그 일이 스스로 익어 갈 시간을 허락해 보셔도 좋습니다."], ["당신은 애쓰지 않았는데 어느 날 문득 그 일이 이해된 적이 있다고 응답하셨습니다. 오랫동안 풀리지 않던 일이 어느 순간 다르게 보였다면, 그 일이 이미 당신 안에서 조용히 익어 가고 있었다는 뜻입니다.", "이것이 발효가 일어나는 모습입니다. 발효는 밖에서 무엇을 더하지 않아도 안에서 저절로 일어나고, 한 순간에 깨달아집니다. 그 깨달음이 지금의 생각과 선택 안에서 어떻게 이어지고 있는지 돌아보시면, 그 경험은 더 깊은 힘이 될 수 있습니다."], ["당신은 그렇게 문득 이해된 일이 여러 번 있었고, 그때마다 그 일을 바라보는 마음이 달라졌다고 응답하셨습니다. 지난 일이 한 번의 깨달음으로 끝나지 않고, 시간이 지나며 거듭 새로운 의미로 다가오고 있습니다.", "이것은 발효가 깊이 진행되고 있는 상태입니다. 같은 사건이라도 그것을 바라보는 마음이 달라지면, 그 일은 더 이상 나를 붙잡는 상처로만 남지 않고 나를 자라게 하는 재료가 됩니다. 이제 그 깨달음들이 실제 삶에서 어떤 새로운 모습으로 움트고 있는지 살펴보실 수 있습니다."]]}, {"sub": null, "stem": "그 시간을 지나온 지금, 내 안에 새롭게 움트는 것이 있는지 돌아보는 상황입니다.", "opts": ["새롭게 움트는 것이 있다고 느끼지 못하고, 예전과 크게 다르지 않다고 생각한다.", "무언가 달라지고 있다는 느낌은 있지만 아직 무엇인지 분명하지 않다.", "예전에는 없던 새로운 마음이나 방향이 조금씩 자라고 있다는 것을 느낀다.", "그 시간을 지나며 내 안에 새롭게 생겨난 것을 실제 삶으로 싹틔우기 시작했다."], "fb": [["당신은 시간을 지나온 뒤에도 새롭게 움트는 것이 있다고 느끼지 못하고, 예전과 크게 다르지 않다고 생각한다고 응답하셨습니다. 힘든 시간을 지나왔지만 아직 그 경험이 새로운 마음이나 방향으로 이어지고 있다는 느낌은 분명하지 않은 상태입니다.", "발효는 겉으로 즉시 결과가 나타나는 과정이 아닙니다. 한동안은 아무것도 변하지 않는 것처럼 느껴질 수 있습니다. 그러나 발효가 진행되면 이전에는 없었던 생각, 가치, 관심, 방향이 조금씩 생겨나기 시작합니다. 아직 새싹이 보이지 않는다고 해서 내면의 변화가 없다고 단정할 수는 없습니다."], ["당신은 무언가 달라지고 있다는 느낌은 있지만 아직 무엇인지 분명하지 않다고 응답하셨습니다. 이전과 똑같지는 않지만 새로운 것이 아직 뚜렷한 형태를 갖추지는 않은 상태입니다. 예전의 방식은 조금씩 힘을 잃고 있고, 그 자리에 새로운 생각이나 방향이 생겨나고 있을 수 있습니다.", "발효의 중간에서는 바로 이런 모호한 시간이 나타납니다. 이전 것은 완전히 사라지지 않았고 새로운 것은 아직 완성되지 않은 상태입니다. 따라서 지금 느끼는 막연함은 변화가 없다는 뜻이라기보다, 변화가 아직 모습을 갖추는 중이라는 의미일 수 있습니다."], ["당신은 예전에는 없던 새로운 마음이나 방향이 조금씩 자라고 있다는 것을 느낀다고 응답하셨습니다. 지나온 경험이 단순히 과거로 끝나지 않고 지금의 생각과 선택 안에서 새로운 방향으로 나타나기 시작했습니다. 무엇을 중요하게 여기는지, 어떤 삶을 살고 싶은지에 대한 기준도 조금씩 달라지고 있을 수 있습니다.", "이것은 발효를 통해 새로운 것이 싹트기 시작한 상태입니다. 아직 완성된 결과가 아니라는 점이 중요합니다. 지금 생겨난 작은 변화가 앞으로 무엇으로 자랄지는 다음 과정에서 더 분명해질 것입니다."], ["당신은 그 시간을 지나며 내 안에 새롭게 생겨난 것을 실제 삶으로 싹틔우기 시작했다고 응답하셨습니다. 내면에서 생겨난 새로운 의미가 생각에만 머물지 않고 실제 삶의 선택과 방향으로 나타나고 있습니다. 과거의 경험이 단순한 깨달음이 아니라 지금의 삶을 움직이는 새로운 힘으로 바뀌고 있는 것입니다.", "발효를 통해 생겨난 것은 이제 다음 단계로 넘어갈 준비를 합니다. 새롭게 생겨난 것 안에는 무엇을 남겨야 하고 무엇을 내려놓아야 하는지가 함께 들어 있기 때문입니다. 다음 단계에서는 바로 이 둘을 구별하고, 그 안에서 본질을 추출하는 과정이 시작됩니다."]]}], "note": "요드는 분주하던 활동의 시간이 줄어들고 내면 성찰로 들어가는 단계"}, {"id": "bium", "label": "비움", "letter": "ש·ז", "qTitle": "비움 · 내려놓음", "qSub": null, "intro": [], "items": [{"sub": null, "stem": "수고한 것의 열매를 거둘 때가 되었다고 생각했는데, 막상 현실은 여전히 넉넉하지 않고 수고를 알아주는 사람도 많지 않습니다. 아무 결과나 인정으로 평가할 것이 없을 때, 나는 나의 가치를 어떻게 봅니까?", "opts": ["수고가 헛된 것처럼 느껴져 받아들이기 어렵다.", "인정받지 못한 것이 마음에 오래 남는다.", "인정받고 싶은 마음이 있지만, 그것이 나를 평가하는 절대적인 기준이 아니라는 생각을 갖기 시작했다.", "결과로 인정받지 않아도 그것이 내 삶의 가치를 결정하지 않는다고 생각한다."], "fb": [["당신은 수고가 헛된 것처럼 느껴져 받아들이기 어렵다고 응답하셨습니다.", "오랫동안 애써왔는데 눈에 보이는 열매가 없으면, 그동안의 수고까지 아무 의미가 없었던 것처럼 느껴질 수 있습니다. 특히 많은 시간과 마음을 쏟아온 사역일수록 “이 정도로 했으면 무엇인가 남아야 하지 않을까” 하는 마음이 생길 수 있습니다.", "그러나 열매가 적다고 해서 수고까지 헛된 것은 아닙니다. 지금 마음을 무겁게 하는 것은 결과 자체일 수도 있지만, 그 안에 “이만큼 수고했으니 인정받아야 한다”는 기대가 함께 있을 수도 있습니다.", "수고한 것과 인정받는 것은 같은 것이 아닙니다. 내가 충성한 사실은 사람들이 알아주지 않아도 사라지지 않습니다. 이 둘을 구별하기 시작하면, 결과가 기대와 달라도 하나님 앞에서 드린 수고의 의미를 잃지 않을 수 있습니다."], ["당신은 인정받지 못한 것이 마음에 오래 남는다고 응답하셨습니다.", "오랫동안 애써온 만큼 누군가 알아주기를 바라는 마음은 자연스러운 것입니다. 문제는 사람의 인정이 내 수고의 가치를 판단하는 기준이 될 때입니다. 알아주면 내가 잘하고 있는 것 같고, 알아주지 않으면 내가 한 일까지 부정되는 것처럼 느껴질 수 있습니다.", "이럴 때 구별해야 할 것은 인정받고 싶은 마음과 내가 하나님 앞에서 충성한 사실입니다. 사람의 평가는 달라질 수 있지만, 내가 맡겨진 자리에서 성실하게 살아온 시간까지 없어지는 것은 아닙니다.", "인정을 받고 싶은 마음을 억지로 없애기보다, 그것이 내 삶의 기준이 되지 않도록 분리할 수 있습니다. 그렇게 되면 사람의 반응에 따라 수고의 의미까지 흔들리지 않을 수 있습니다."], ["당신은 인정받고 싶은 마음이 있지만, 그것이 자신을 평가하는 절대적인 기준이 아니라는 생각을 갖기 시작했다고 응답하셨습니다.", "당신은 인정받고 싶은 마음을 부정하지 않으면서도, 그것이 자신의 가치를 결정하는 기준은 아니라는 것을 알고 있습니다. 누군가 알아주면 감사할 수 있지만, 알아주지 않았다고 해서 자신의 수고 전체를 부정하지는 않을 수 있습니다.", "이제 열매와 나 자신, 인정과 충성을 서로 구별해서 볼 수 있습니다. 결과는 하나님께 맡기고, 내가 맡은 몫은 충실하게 감당할 수 있습니다.", "사람에게서 받은 인정은 내려놓을 수 있어도, 그 과정에서 배운 충성과 섬김까지 내려놓을 필요는 없습니다. 그것은 앞으로도 가지고 갈 수 있는 것입니다."], ["당신은 결과로 인정받지 않아도 그것이 내 삶의 가치를 결정하지 않는다고 생각한다고 응답하셨습니다.", "당신은 결과와 자신의 가치를 서로 묶지 않고 볼 수 있습니다. 열매가 많을 때만 가치 있는 것이 아니며, 사람들의 평가가 줄어들어도 하나님 앞에서 살아온 시간의 의미를 잃지 않을 수 있습니다.", "이제 수고의 열매를 자신의 존재를 증명하는 증거로 삼지 않아도 됩니다. 칭찬은 감사히 받을 수 있지만, 칭찬이 없어도 충성은 충성으로 남습니다.", "이렇게 구별할 수 있다면 결과가 어떠하든 하나님께서 내 안에 남기신 것과 내가 사람들에게 남긴 것을 가지고 다음 길을 충분히 걸어가실 수 있습니다."]], "head": "수고한 것의 열매와 나의 가치를 구별합니다"}, {"sub": null, "stem": "오랫동안 맡아온 역할과 자리를 이제 다른 사람에게 넘겨주어야 합니다. 그 때 나는 어떻게 반응할까요?", "opts": ["그 역할이 사라지면 내가 누구인지도 흔들릴 것 같다.", "필요한 사람이 아니라는 사실이 마음에 오래 남고 다시 그 자리를 되찾고 싶어진다.", "그 역할과 나 자신이 같지 않다는 것을 알고 조금씩 분리하기 시작한다.", "역할과 관계없이 내 안에 남아 있는 것을 돌아보며 그 자리를 내려놓을 수 있다."], "fb": [["당신은 그 역할이 사라지면 내가 누구인지도 흔들릴 것 같다고 응답하셨습니다.", "오랫동안 맡았던 직분과 사역의 자리가 자신의 이름처럼 느껴질 수 있습니다. 사람들에게 어떤 역할의 사람으로 불리는 것이 익숙해질수록 그 자리를 내려놓는 일이 자신의 존재를 내려놓는 것처럼 느껴질 수도 있습니다.", "하지만 직분은 하나님께서 맡기신 것이지 나 자신 그 자체는 아닙니다. 내가 그 자리에 있었던 것과 내가 누구인가는 같은 것이 아닙니다.", "지금 붙들고 있는 것이 정말 그 사역인지, 아니면 그 자리를 통해 얻었던 필요함과 인정인지 조금씩 구별해 볼 수 있습니다. 자리가 끝나도 하나님 앞에 있는 자신까지 끝나는 것은 아닙니다."], ["당신은 필요한 사람이 아니라는 사실이 마음에 오래 남고 다시 그 자리를 되찾고 싶어진다고 응답하셨습니다.", "자리를 잃는 것보다 “이제는 나를 필요로 하지 않는구나”라는 느낌이 더 아플 수 있습니다. 그래서 다시 그 자리를 얻으면 자신의 존재도 다시 확인될 것처럼 느껴질 수 있습니다.", "그러나 필요한 사람이 되는 것과 하나님께서 사랑하시고 부르신 사람으로 사는 것은 같은 일이 아닙니다. 한 자리에서 필요했던 시간이 끝났다고 해서 하나님의 관심에서 벗어나는 것도 아닙니다.", "지금 다시 붙들고 싶은 것이 사역 자체인지, 그 사역을 통해 얻었던 필요함과 인정인지 구별할 수 있습니다. 그 구별이 생기면 자리를 내려놓는 것이 곧 자신을 잃는 일이 아니라는 것도 알게 됩니다."], ["당신은 그 역할과 나 자신이 같지 않다는 것을 알고 조금씩 분리하기 시작한다고 응답하셨습니다.", "맡았던 직분과 자신의 존재를 조금씩 구별하고 있습니다. 그 자리를 소중하게 여겼던 마음을 부정하지 않으면서도, 그 자리가 사라져도 하나님 앞에서의 나는 남는다는 사실을 받아들이기 시작한 것입니다.", "내가 하던 일을 다른 사람이 이어갈 수도 있고, 내가 맡았던 역할을 내려놓을 수도 있습니다. 그것이 내가 실패했다는 뜻은 아닙니다.", "맡겨진 때가 있었고 그때의 몫을 감당했다면, 그것 역시 충성의 한 모습입니다. 이제 그 자리에서 얻은 지혜와 사랑은 가지고 가고, 그 자리에 꼭 내가 있어야 한다는 마음은 내려놓을 수 있습니다."], ["당신은 역할과 관계없이 내 안에 남아 있는 것을 돌아보며 그 자리를 내려놓을 수 있다고 응답하셨습니다.", "당신은 직분과 자신의 존재를 구별할 수 있습니다. 자리가 사라져도 그동안 하나님께서 내 안에 이루신 것까지 사라지는 것은 아니라는 것을 알고 있습니다.", "이제 자리를 붙들기보다 그 자리를 통해 무엇을 배우고 무엇을 남겼는지를 가지고 갈 수 있습니다. 사람을 세우고, 말씀을 전하고, 사랑하고, 견디면서 내 안에 쌓인 것은 직분을 내려놓는다고 사라지지 않습니다.", "자리는 다른 사람에게 넘겨줄 수 있지만, 그 시간을 통해 하나님께서 내 안에 남기신 것은 계속 가지고 가실 수 있습니다."]], "head": "맡았던 자리와 나 자신을 구별합니다"}, {"sub": null, "stem": "애써온 판단이나 방향이 틀렸다는 것을 알게 되었거나, 오랜 수고가 원하는 결과로 이어지지 않은 상황입니다. 나는 그것과 나 자신을 어떻게 구별합니까?", "opts": ["결과가 좋지 않거나 내가 틀렸다면 내가 부족한 사람이라는 생각이 든다.", "기대와 다르면 그동안의 노력과 믿어온 것까지 모두 의미 없어진 것처럼 느껴진다.", "결과나 판단의 옳고 그름과 나 자신이 같지 않다는 것을 알고, 부족했던 부분만 따로 구별해서 본다.", "옳았는지 결과가 어땠는지와 관계없이, 그 과정에서 내 안에 남은 것이 무엇인지 돌아볼 수 있다."], "fb": [["당신은 결과가 좋지 않거나 내가 틀렸다면 내가 부족한 사람이라는 생각이 든다고 응답하셨습니다.", "일의 결과와 자신을 하나로 묶어 생각하기 쉬운 상태입니다. 일이 잘되면 내가 괜찮은 사람처럼 느껴지고, 잘못되면 나까지 잘못된 사람처럼 느껴질 수 있습니다.", "그러나 잘못된 판단은 잘못된 판단이고, 사람 전체가 잘못된 것은 아닙니다. 내가 틀린 부분을 인정하는 것과 나 자신을 부정하는 것은 다른 일입니다.", "그래서 “무엇을 잘못 판단했는가”와 “나는 어떤 사람인가”를 나누어 볼 수 있습니다. 잘못은 바로잡고, 배움은 남기고, 자신까지 버릴 필요는 없습니다."], ["당신은 기대와 다르면 그동안의 노력과 믿어온 것까지 모두 의미 없어진 것처럼 느껴진다고 응답하셨습니다.", "오랫동안 믿고 애써온 방향이 흔들리면 그동안의 시간까지 부정하고 싶어질 수 있습니다. “그렇다면 내가 그동안 한 것은 무엇이었나”라는 생각이 들 수 있습니다.", "그러나 결과가 기대와 달랐다고 해서 그 과정 전체가 없어지는 것은 아닙니다. 그 과정에서 배운 것, 만난 사람, 견딘 시간, 새롭게 알게 된 것은 남아 있습니다.", "특히 여기에서 구별할 것은 내가 옳았다는 사실과 내가 충실하게 걸어온 시간입니다. 내가 옳지 않았다는 사실을 인정한다고 해서 그동안의 모든 수고가 거짓이 되는 것은 아닙니다."], ["당신은 결과나 판단의 옳고 그름과 나 자신이 같지 않다는 것을 알고, 부족했던 부분만 따로 구별해서 본다고 응답하셨습니다.", "당신은 잘못을 인정한다고 해서 자신 전체를 부정하지 않습니다. 결과가 좋지 않았다면 부족했던 부분을 볼 수 있고, 판단이 잘못되었다면 그것을 고칠 수 있습니다.", "이것은 책임을 피하는 것이 아니라 책임질 것을 정확하게 구별하는 것입니다. 내가 잘못한 것은 내가 책임지고, 내가 아닌 것까지 내 잘못으로 끌어안을 필요는 없습니다.", "이렇게 구별할 수 있으면 실패에서도 가져갈 것이 생깁니다. 잘못된 방법은 내려놓고, 그 과정에서 얻은 지혜와 분별은 가지고 갈 수 있습니다."], ["당신은 옳았는지 결과가 어땠는지와 관계없이, 그 과정에서 내 안에 남은 것이 무엇인지 돌아볼 수 있다고 응답하셨습니다.", "당신은 지나온 시간을 성공과 실패만으로 판단하지 않습니다. 그 과정에서 무엇을 배웠는지, 어떤 사람이 되었는지, 하나님께서 무엇을 깨닫게 하셨는지를 볼 수 있습니다.", "이제 중요한 것은 내가 옳았다는 것을 끝까지 증명하는 것이 아닙니다. 그 시간을 통해 내 안에 남은 좋은 것을 가지고 다음 길로 가는 것입니다.", "잘못된 판단은 내려놓고 경험에서 얻은 지혜는 가져갈 수 있습니다. 실패했던 방법은 버리되, 그 과정에서 배운 사랑과 인내와 분별은 남길 수 있습니다."]], "head": "실패와 나 자신을 구별합니다"}, {"sub": null, "stem": "언젠가는 누군가 알아줄 것이라 기대하며 달려왔는데, 이제 은퇴를 앞두고 있습니다. 명예도 인정도 없이, 빈손으로 나가라는 말을 듣는 상황입니다. 그래도 마지막까지 붙잡고 싶은 것이 있다면, 나는 무엇 때문에 그것을 붙들고 있습니까?", "opts": ["물질적으로 남는 것이 없다는 사실이 가장 먼저 마음을 무겁게 한다.", "그동안의 수고와 이름을 아무도 기억해 주지 않는다는 것이 가장 견디기 어렵다.", "맡았던 역할과 부르심마저 끝난 것 같아 내가 누구인지 흔들릴 것 같다.", "그 모든 것이 사라져도, 그 너머에 남아 있는 나 자신과 하나님 앞의 나는 흔들리지 않을 것이다."], "fb": [["당신은 물질적으로 남는 것이 없다는 사실이 가장 먼저 마음을 무겁게 한다고 응답하셨습니다.", "오랫동안 수고했는데 결국 손에 남는 것이 없다는 생각이 들면 허탈할 수 있습니다. 특히 사역의 전환기에는 실제적인 생활에 대한 걱정도 현실적인 문제입니다.", "다만 여기에서는 내가 가진 것과 내가 살아온 삶의 가치를 구별할 필요가 있습니다. 물질은 현실적으로 중요하지만, 그것이 지나온 사역 전체의 열매를 대신할 수는 없습니다.", "지금 붙들고 있는 것이 생활을 위한 정당한 염려인지, 아니면 “내가 이만큼 했으니 이 정도는 남아야 한다”는 보상에 대한 기대인지 구별해 볼 수 있습니다. 두 가지는 서로 다른 문제입니다."], ["당신은 그동안의 수고와 이름을 아무도 기억해 주지 않는다는 것이 가장 견디기 어렵다고 응답하셨습니다.", "당신에게 가장 아픈 것은 물질보다 기억일 수 있습니다. “내가 이렇게까지 했는데 아무도 기억하지 않는구나”라는 생각이 들면 지나온 세월 전체가 사라지는 것처럼 느껴질 수 있습니다.", "그러나 사람에게 기억되는 것과 하나님 앞에서 살아온 것은 같은 기준으로 볼 수 없습니다. 이름이 오래 기억되지 않는다고 해서 그 사람이 사랑했던 시간까지 사라지는 것은 아닙니다.", "여기에서 내려놓을 수 있는 것은 수고 자체가 아니라, 내 이름이 반드시 남아야 한다는 마음일 수 있습니다. 이름은 희미해져도 사람에게 베푼 사랑과 가르침, 함께 흘린 눈물과 기도까지 없어지는 것은 아닙니다."], ["당신은 맡았던 역할과 부르심마저 끝난 것 같아 내가 누구인지 흔들릴 것 같다고 응답하셨습니다.", "오랫동안 자신의 삶을 사명과 역할을 중심으로 살아왔다면, 그 역할이 끝나는 순간 삶 전체가 끝난 것처럼 느껴질 수 있습니다.", "하지만 한 시기의 역할이 끝나는 것과 하나님 앞에서의 삶이 끝나는 것은 다릅니다. 지금까지 맡았던 역할은 소중했지만, 그 역할이 나 자신 전체를 설명하는 것은 아닙니다.", "이제 “나는 어떤 직분을 가진 사람인가”만 붙들기보다 “하나님께서 지금까지 내 안에 무엇을 남기셨는가”를 볼 수 있습니다. 역할은 끝날 수 있어도 그 역할을 통해 배운 사랑과 지혜와 믿음은 남아 있을 수 있습니다."], ["당신은 그 모든 것이 사라져도, 그 너머에 남아 있는 나 자신과 하나님 앞의 나는 흔들리지 않을 것이라고 응답하셨습니다.", "당신은 물질과 명예, 역할과 사람들의 평가가 사라져도 자신이 누구인지를 잃지 않을 수 있습니다. 이것은 지나온 수고를 가볍게 여긴다는 뜻이 아닙니다.", "오히려 이제 수고와 명예보다 더 깊은 곳에 있는 것을 붙들 수 있다는 뜻입니다. 사람들에게 알려진 이름보다 하나님 앞에 있는 자신을 중요하게 여기고, 맡았던 역할보다 그 역할을 통해 하나님께서 이루신 것을 바라볼 수 있습니다.", "그러므로 자리를 내려놓아도 자신까지 내려놓을 필요는 없습니다. 하나님 앞에 남아 있는 자신과 그동안 하나님께서 내 안에 남기신 것을 가지고 다음 길을 충분히 걸어가실 수 있습니다."]], "head": "명예와 자리 너머에 남는 것을 봅니다"}, {"sub": null, "stem": "사역을 마친 뒤 사람들에게 어떤 사람으로 기억되고 싶은지, 어떤 칭찬과 칭송을 듣고 싶은지 떠올려 보는 상황입니다. 그런 사람으로 기억되지 못한다면 내 기분은 어떨 것 같습니까?", "opts": ["그렇게 기억되지 못하면 견디기 어렵고, 그동안의 수고가 헛된 것 같다.", "칭찬이나 칭송을 듣지 못하면 서운함과 아쉬움이 오래 남을 것 같다.", "서운한 마음은 들겠지만, 어떻게 기억되든 내 삶의 가치가 달라지지는 않는다고 생각할 것 같다.", "사람들의 칭찬이나 기억과 상관없이, 내가 걸어온 길은 하나님 앞에서 온전하다고 여길 것 같다."], "head": "사람들의 기억과 하나님 앞의 나를 구별합니다", "fb": [["당신은 그렇게 기억되지 못하면 견디기 어렵고, 그동안의 수고가 헛된 것 같다고 응답하셨습니다.", "오랜 세월을 바쳐 섬겨 왔다면, 그 수고가 어떤 모습으로든 기억되기를 바라는 것은 자연스러운 마음입니다. 그런데 기억되지 못할 때 수고 전체가 헛된 것처럼 느껴진다면, 사람들의 기억이 내 수고의 의미를 정하는 기준이 되어 있는 것일 수 있습니다.", "여기에서 구별할 것은 사람들이 나를 기억하는 방식과 내가 실제로 살아온 시간입니다. 사람들의 기억은 희미해지거나 달라질 수 있지만, 하나님 앞에서 충성한 시간까지 사라지는 것은 아닙니다.", "먼저 내가 듣고 싶은 칭찬이 무엇인지 솔직하게 떠올려 보십시오. 그 말 안에 내가 정말 붙들고 싶은 것이 무엇인지 보일 수 있습니다."], ["당신은 칭찬이나 칭송을 듣지 못하면 서운함과 아쉬움이 오래 남을 것 같다고 응답하셨습니다.", "듣고 싶은 말이 있다는 것은 그만큼 마음을 다해 살아왔다는 뜻이기도 합니다. 다만 그 서운함이 오래 남으면, 지나온 사역을 떠올릴 때마다 감사보다 아쉬움이 먼저 앞설 수 있습니다.", "서운한 마음을 억지로 없앨 필요는 없습니다. 그 마음을 인정하면서도, 사람들에게 듣는 칭찬과 하나님 앞에서 내가 걸어온 길을 조금씩 구별해 볼 수 있습니다. 칭찬은 받지 못해도 충성은 충성으로 남습니다."], ["당신은 서운한 마음은 들겠지만, 어떻게 기억되든 내 삶의 가치가 달라지지는 않는다고 생각할 것 같다고 응답하셨습니다.", "기억되고 싶은 마음을 부정하지 않으면서도, 그 기억이 내 삶의 가치를 결정하지 않는다는 것을 알고 있습니다. 서운함과 흔들리지 않는 중심이 함께 있을 수 있다는 것을 이미 받아들이고 계신 것입니다.", "이렇게 구별할 수 있으면 사람들의 평가는 감사히 받되 거기에 매이지 않을 수 있습니다. 어떤 이름으로 기억되느냐보다 그동안 사람들과 나눈 사랑과 섬김이 무엇을 남겼는지를 바라보며 다음 길을 걸어가실 수 있습니다."], ["당신은 사람들의 칭찬이나 기억과 상관없이, 내가 걸어온 길은 하나님 앞에서 온전하다고 여길 것 같다고 응답하셨습니다.", "사람들의 기억과 하나님 앞에서의 삶을 분명하게 구별할 수 있습니다. 이것은 지나온 수고를 가볍게 여긴다는 뜻이 아니라, 그 수고의 의미를 사람들의 평가보다 더 깊은 곳에 두고 있다는 뜻입니다.", "칭송은 사라질 수 있지만 하나님 앞에서 걸어온 길은 사라지지 않습니다. 그 온전함을 붙들고, 하나님께서 내 안에 남기신 것을 가지고 다음 길을 충분히 걸어가실 수 있습니다."]]}]}, {"id": "onjeon", "label": "온전함", "letter": "א·ח", "qTitle": "온전함 · 이것이 나다", "qSub": null, "intro": [], "items": [{"sub": null, "stem": "내가 옳다고 생각하는 것과 집단, 공동체, 사회 전체의 입장이 부딪히는 상황입니다.", "opts": ["내가 옳다는 확신이 있으면 상대의 입장은 별로 고려하지 않는다.", "상대 입장도 생각해야 한다는 것은 알지만 내 생각을 내려놓기 어렵다.", "내가 옳다고 생각하는 부분과 상대 입장을 함께 살펴보려 한다.", "무엇이 본질인지 분별하며 두 입장을 함께 바라볼 수 있다."], "fb": [["당신은 내가 옳다는 확신이 있으면 상대의 입장은 별로 고려하지 않는다고 응답하셨습니다.", "내가 옳다고 확신할수록 상대의 말이 틀린 것으로만 들릴 수 있습니다. 특히 오랫동안 쌓아온 경험과 신념이 있을수록 다른 의견을 받아들이는 것이 자신의 믿음을 포기하는 것처럼 느껴질 수도 있습니다.", "그러나 내가 옳다고 생각하는 것과 내가 모든 것을 옳게 알고 있다는 것은 같은 말이 아닙니다. 다른 사람의 입장을 듣는다고 해서 내 믿음을 버리는 것도 아닙니다.", "중요한 것은 내 생각을 무조건 지키는 것이 아니라, 그 안에서 정말 지켜야 할 것이 무엇인지 구별하는 것입니다. 내 생각과 하나님의 뜻, 내 주장과 본질을 서로 같은 것으로 만들지 않을 때 다른 사람의 이야기도 들을 수 있습니다."], ["당신은 상대의 입장도 생각해야 한다는 것은 알지만 내 생각을 내려놓기 어렵다고 응답하셨습니다.", "상대방을 이해해야 한다는 사실은 알고 있지만, 자신의 생각을 바꾸는 것은 아직 쉽지 않을 수 있습니다. 특히 오랫동안 옳다고 믿어온 것이라면 그것을 내려놓는 일이 신념을 버리는 것처럼 느껴질 수도 있습니다.", "하지만 상대의 이야기를 듣는 것과 내 생각을 포기하는 것은 다릅니다. 내가 옳다고 생각하는 부분은 지키면서도, 내가 미처 보지 못한 부분은 받아들일 수 있습니다.", "이렇게 하나씩 구별하다 보면 “내가 옳으냐, 상대가 옳으냐”만 따지는 자리에서 벗어나 무엇이 정말 중요한지를 함께 볼 수 있습니다."], ["당신은 내가 옳다고 생각하는 부분과 상대의 입장을 함께 살펴보려 한다고 응답하셨습니다.", "당신은 자신의 생각을 무조건 버리지 않으면서도 다른 사람의 입장을 함께 볼 수 있습니다. 내 생각에 중요한 부분이 있다면 그것을 지키되, 상대방에게도 그렇게 생각할 만한 이유가 있다는 것을 인정할 수 있습니다.", "이제 판단의 기준이 “누가 이겼는가”에서 “무엇이 중요한가”로 조금씩 옮겨가고 있습니다.", "이렇게 바라볼 수 있으면 공동체 안에서 서로 다른 생각이 반드시 갈등으로 끝나지는 않습니다. 서로 다른 의견 가운데에서도 지켜야 할 것은 지키고, 내려놓을 것은 내려놓을 수 있습니다."], ["당신은 무엇이 본질인지 분별하며 두 입장을 함께 바라볼 수 있다고 응답하셨습니다.", "당신은 자신의 생각과 상대의 생각 가운데 어느 한쪽을 무조건 붙들기보다, 그 너머에서 정말 지켜야 할 것이 무엇인지 볼 수 있습니다.", "이것은 모든 의견이 똑같이 옳다는 뜻이 아닙니다. 오히려 무엇을 반드시 지켜야 하고 무엇은 내 생각일 뿐인지 구별할 수 있다는 뜻입니다.", "내 주장을 내려놓아도 진리가 무너지는 것은 아니며, 다른 사람의 의견을 받아들여도 내가 가진 중요한 것을 잃는 것은 아닙니다. 본질을 붙들면 주변의 생각은 조금 달라져도 중심을 잃지 않을 수 있습니다."]], "head": "내가 옳다고 생각하는 것과 다른 사람의 입장이 부딪힐 때"}, {"sub": null, "stem": "아무것도 증명하지 않아도 되는 자리에서 나는 어떨 것 같습니까?", "opts": ["증명할 것이 없으면 내가 누구인지조차 불안하게 느껴진다.", "성취가 없어도 된다는 것은 알지만 그 상태의 나를 편안하게 받아들이기는 어렵다.", "무엇을 하지 않아도 존재하는 나를 조금씩 받아들이기 시작한다.", "무엇을 하든 하지 않든 존재하는 나 자신을 편안하게 받아들일 수 있다."], "fb": [["당신은 증명할 것이 없으면 내가 누구인지조차 불안하게 느껴진다고 응답하셨습니다.", "무언가를 잘하고 있다는 것을 보여주고 있을 때는 자신이 분명한데, 아무것도 증명할 필요가 없어지면 오히려 자신이 흐릿하게 느껴질 수 있습니다. 그동안 사역과 성취, 역할과 인정이 자신을 설명하는 중요한 말이 되어 있었기 때문일 수 있습니다.", "그래서 아무것도 하지 않는 시간이 단순한 쉼이 아니라 “나는 이제 무엇이지?”라는 질문으로 이어질 수도 있습니다.", "그러나 하나님 앞에서 사람의 가치는 무엇을 해냈는가로만 결정되지 않습니다. 일하기 때문에 존재하는 것이 아니라, 존재하기 때문에 일하는 것입니다."], ["당신은 성취가 없어도 된다는 것은 알지만 그 상태의 나를 편안하게 받아들이기는 어렵다고 응답하셨습니다.", "머리로는 “무언가를 이루지 않아도 괜찮다”는 것을 알고 있지만, 실제로 아무것도 증명하지 않는 자리에 있으면 마음이 불편할 수 있습니다.", "오랫동안 맡은 일을 잘하고 사람들에게 필요한 사람이 되는 것으로 자신을 확인해왔다면, 아무것도 하지 않는 자신을 받아들이는 데 시간이 필요할 수 있습니다.", "이때 새로운 성취를 찾아 자신을 다시 확인하기보다, 하나님 앞에서는 무엇을 이루기 전에도 내가 존재한다는 사실을 조금씩 받아들일 수 있습니다. 성취가 없어도 사라지지 않는 자신을 알아가는 것입니다."], ["당신은 무엇을 하지 않아도 존재하는 나를 조금씩 받아들이기 시작한다고 응답하셨습니다.", "당신은 자신의 가치를 성취와 역할에서만 찾지 않기 시작했습니다. 아무것도 하지 않는 순간에도 내가 존재하고 있으며, 그 존재 자체가 사라지는 것은 아니라는 사실을 받아들이고 있습니다.", "이제 사역을 하지 않는 자신도 받아들일 수 있고, 다른 사람에게 인정받지 못하는 순간에도 자신을 잃지 않을 수 있습니다.", "이것은 아무것도 하지 않겠다는 뜻이 아닙니다. 무엇인가를 하기 위해 자신을 증명해야 하는 마음에서 조금씩 자유로워지는 것입니다."], ["당신은 무엇을 하든 하지 않든 존재하는 나 자신을 편안하게 받아들일 수 있다고 응답하셨습니다.", "당신은 자신의 존재와 성취를 구별할 수 있습니다. 무엇을 많이 했을 때만 가치 있는 것이 아니며, 역할이 줄어들어도 자신이 사라지는 것은 아니라는 것을 받아들일 수 있습니다.", "그래서 이제 무엇인가를 하기 위해 자신을 증명할 필요가 없습니다. 하고 싶다면 할 수 있고, 맡겨진 일이 있다면 충실하게 감당할 수 있으며, 내려놓아야 할 때는 내려놓을 수도 있습니다.", "존재를 증명하기 위해 사는 것이 아니라, 이미 하나님 앞에 있는 자신으로 살아갈 수 있습니다."]], "head": "아무것도 증명하지 않아도 되는 자리에서"}, {"sub": null, "stem": "지금 내가 맡아온 일이나 역할, 다른 사람의 인정이 모두 사라지는 상황입니다.", "opts": ["내가 해온 일이나 역할이 사라지면 내가 누구인지 알기 어려울 것 같다.", "그런 것들이 없어도 내가 있다는 것은 알지만, 나 자신을 설명하기는 어려울 것 같다.", "내가 해온 일과 나 자신이 같지는 않다는 것을 생각할 수 있다.", "내가 무엇을 하거나 어떤 자리에 있느냐와 관계없이 나 자신을 바라보고 받아들일 수 있다."], "fb": [["당신은 내가 해온 일이나 역할이 사라지면 내가 누구인지 알기 어려울 것 같다고 응답하셨습니다.", "지금까지 해온 일이 자신을 설명하는 가장 중요한 말이 되어 있을 수 있습니다. 그래서 역할이 사라지면 그동안의 삶까지 함께 사라지는 것처럼 느껴질 수 있습니다.", "하지만 사역은 내가 살아온 한 부분이지 나 자신 전체는 아닙니다. 맡았던 자리가 사라진다고 해서 그동안 하나님께서 내 안에 이루신 것까지 사라지는 것은 아닙니다. 직분은 내려놓을 수 있지만, 그 직분을 통해 형성된 사람까지 내려놓을 필요는 없습니다."], ["당신은 그런 것들이 없어도 내가 있다는 것은 알지만, 나 자신을 설명하기는 어려울 것 같다고 응답하셨습니다.", "역할과 인정이 없어도 자신이 존재한다는 것은 알고 있지만, “그렇다면 나는 누구인가”라는 질문에는 아직 쉽게 답하기 어려울 수 있습니다.", "오랫동안 자신을 사역과 역할로 설명해왔기 때문에 그것을 빼고 나면 자신을 표현할 말이 줄어드는 것입니다.", "그러나 지금까지 맡았던 역할의 이름을 하나씩 내려놓고 보면 그 아래에 사랑했던 마음, 견뎌온 시간, 배운 지혜, 하나님을 향해 걸어온 믿음이 남아 있습니다.", "그동안 무엇을 했는가보다 그 시간을 통해 어떤 사람이 되어왔는지를 볼 수 있습니다."], ["당신은 내가 해온 일과 나 자신이 같지는 않다는 것을 생각할 수 있다고 응답하셨습니다.", "당신은 자신이 해온 일을 소중하게 여기면서도 그것과 자신의 존재를 구별할 수 있습니다. 목회와 사역은 자신의 삶에서 중요한 부분이지만, 그것이 자신의 전부는 아니라는 것을 알고 있습니다.", "그래서 역할을 내려놓는 순간에도 자신을 잃지 않을 수 있습니다. 자리는 바뀌어도 하나님께서 내 안에 이루신 것은 남습니다.", "앞으로는 내가 맡은 역할을 통해 나를 설명하기보다, 내 안에 남아 있는 사랑과 믿음과 지혜를 가지고 새로운 자리에서 살아갈 수 있습니다."], ["당신은 내가 무엇을 하거나 어떤 자리에 있느냐와 관계없이 나 자신을 바라보고 받아들일 수 있다고 응답하셨습니다.", "당신은 역할과 자신의 존재를 분명하게 구별할 수 있습니다. 어떤 자리에 있든, 혹은 아무런 직함이 없더라도 하나님 앞에 있는 자신을 받아들일 수 있습니다.", "그래서 이제 자리를 지키기 위해 자신을 증명할 필요가 없습니다. 필요한 때에는 맡고, 때가 되면 내려놓고, 다른 사람에게 넘겨줄 수도 있습니다.", "자리는 바뀔 수 있지만 하나님 앞에서의 나는 계속 살아갑니다. 그동안 하나님께서 내 안에 남기신 것을 가지고 새로운 자리에서도 살아갈 수 있습니다."]], "head": "내가 해온 일과 나 자신을 구별할 수 있는가"}, {"sub": null, "stem": "지금 여기, 오늘 만나는 사람들과 이 세상을 향해 여전히 뜨거운 마음을 가지고 있나요?", "opts": ["예전 같은 열정은 많이 식었고, 그저 맡은 일을 덤덤히 해내고 있다.", "마음 한편에 열망은 남아 있지만 일상 속에서 잘 살아나지 않는다.", "거창한 보상이 없어도 오늘 내 앞의 사람과 일에 정성을 쏟으려 한다.", "결과를 따지지 않고, 지금 여기 있는 사람들과 세상을 향해 여전히 뜨거운 마음으로 살아간다."], "fb": [["당신은 예전 같은 열정은 많이 식었고, 그저 맡은 일을 덤덤히 해내고 있다고 응답하셨습니다.", "오랫동안 수고한 뒤에는 열정이 줄어들 수 있습니다. 결과와 인정에 지치고, 사람들에게 실망하면서 마음을 더 이상 크게 쓰지 않으려 할 수도 있습니다.", "그것은 단순히 열정이 부족해서가 아니라, 너무 많이 기대하고 너무 많이 소진했기 때문일 수도 있습니다.", "하지만 모든 것을 내려놓는 것과 마음까지 닫는 것은 다릅니다. 사람에게서 받은 실망을 내려놓는다고 사람을 향한 사랑까지 내려놓아야 하는 것은 아닙니다.", "이제 필요한 것은 예전의 열정을 억지로 되찾는 것이 아니라, 무엇 때문에 마음이 식었는지를 지나 아직 내 안에 남아 있는 사랑이 무엇인지 발견하는 것입니다."], ["당신은 마음 한편에 열망은 남아 있지만 일상 속에서 잘 살아나지 않는다고 응답하셨습니다.", "아직 사람과 세상을 향한 마음은 남아 있습니다. 다만 오랜 시간의 수고와 현실적인 상황 때문에 그 마음을 실제 삶에서 충분히 표현하기 어려울 수 있습니다.", "이때 거창한 목표나 큰 성과를 다시 만들어야 하는 것은 아닙니다. 오늘 내 앞에 있는 한 사람에게 마음을 쓰는 것에서 다시 시작할 수 있습니다.", "열망이 반드시 큰일의 형태로 나타나는 것은 아닙니다. 한 사람의 이야기를 들어주고, 필요한 사람에게 손을 내밀고, 맡은 일을 정성껏 하는 것 안에도 하나님께서 주신 마음은 살아날 수 있습니다."], ["당신은 거창한 보상이 없어도 오늘 내 앞의 사람과 일에 정성을 쏟으려 한다고 응답하셨습니다.", "당신은 큰 결과나 보상을 기다리지 않고 지금 맡겨진 사람과 일에 마음을 줄 수 있습니다.", "이것은 예전과 같은 열정으로 다시 돌아가는 것이 아니라, 결과와 인정에서 조금 자유로워진 사랑입니다.", "사람들이 알아주지 않아도 한 사람을 귀하게 대하고, 큰 성과가 없어도 맡은 일을 정성껏 할 수 있습니다.", "이제 사역의 의미를 “얼마나 크게 이루었는가”로만 보지 않고, 오늘 하나님께서 내 앞에 놓아주신 사람을 어떻게 대했는가에서도 발견할 수 있습니다."], ["당신은 결과를 따지지 않고, 지금 여기 있는 사람들과 세상을 향해 여전히 뜨거운 마음으로 살아간다고 응답하셨습니다.", "당신의 마음은 더 이상 인정이나 보상만을 향하고 있지 않습니다. 결과가 바로 나타나지 않아도 지금 만나는 사람을 귀하게 여기고, 오늘 맡겨진 일에 정성을 쏟을 수 있습니다.", "이것은 예전의 열정을 그대로 되찾았다는 뜻이 아닙니다. 무엇인가를 얻기 위해 사랑하는 것이 아니라, 사랑할 이유가 있기 때문에 사랑하는 마음으로 살아가고 계신 것입니다.", "사람들의 박수나 눈에 보이는 열매가 없어도, 하나님께서 주신 마음으로 오늘의 사람과 세상을 향해 살아가고 계십니다. 이미 그렇게 살고 계십니다."]], "head": "지금 여기의 사람들과 세상을 향해"}, {"sub": null, "stem": "내가 중요하게 여기는 목표를 따라가고 있지만 사람들의 지지가 없고 평가가 부정적인 상황을 가정해봅니다. 사람들의 평가나 상황이 달라져도 내가 중요하게 여기는 방향을 따라갈 수 있다는 확신이 얼마나 듭니까?", "opts": ["사람들의 평가와 상황에 따라 내가 가야 할 방향에 대한 확신이 쉽게 흔들린다.", "내가 중요하게 여기는 방향을 알고 있어도 상황이 달라지면 확신이 크게 흔들린다.", "상황이 달라져도 내가 중요하게 여기는 방향에 대한 확신이 어느 정도 유지된다.", "사람들의 평가나 상황이 달라져도 내가 중요하게 여기는 방향에 대한 확신이 분명하게 유지된다."], "fb": [["당신은 사람들의 평가와 상황에 따라 내가 가야 할 방향에 대한 확신이 심하게 흔들린다고 응답하셨습니다.", "사람들의 반응이 좋으면 내가 가는 길이 맞는 것 같고, 반대가 심하면 내가 잘못 가고 있는 것처럼 느껴질 수 있습니다. 상황이 달라질 때마다 방향까지 다시 결정해야 하는 것처럼 느껴질 수도 있습니다.", "하지만 사람들의 평가와 내가 중요하게 여기는 방향은 같은 것이 아닙니다. 사람들의 동의와 하나님 앞에서 내가 무엇을 중요하게 여기며 살아갈 것인가는 구별할 필요가 있습니다.", "모든 상황에서 같은 방식으로 밀어붙이라는 뜻도 아닙니다. 상황에 따라 방법은 바뀔 수 있지만, 내가 중요하게 여기는 본질까지 매번 바꿀 필요는 없습니다."], ["당신은 내가 중요하게 여기는 방향을 알고 있어도 상황이 달라지면 쉽게 흔들린다고 응답하셨습니다.", "무엇이 중요한지는 알고 있지만 현실의 반응이 달라지면 자신이 가는 길까지 의심하게 될 수 있습니다. 특히 오랫동안 반대나 실패를 경험했다면 더욱 그렇습니다.", "이때 방향과 방법을 구별할 수 있습니다. 방법은 바뀔 수 있습니다. 때로는 기다릴 수도 있고, 돌아갈 수도 있고, 다른 사람에게 맡길 수도 있습니다.", "그러나 방법이 바뀐다고 해서 하나님 앞에서 중요하게 여기는 것이 반드시 바뀌는 것은 아닙니다. 상황에 맞게 방법을 바꾸면서도 본질은 붙들 수 있습니다."], ["당신은 상황이 달라져도 내가 중요하게 여기는 방향에 대한 확신이 어느 정도 유지된다고 응답하셨습니다.", "당신은 현실의 반응을 무시하지 않으면서도, 그것 때문에 자신이 중요하게 여기는 방향까지 쉽게 포기하지는 않습니다.", "필요하면 방법을 바꾸고 기다릴 수 있지만, 무엇을 중요하게 여기며 살아갈 것인지는 붙들 수 있습니다.", "이것은 고집과 다릅니다. 고집은 상황이 달라져도 자기 생각만 반복하는 것이지만, 중심을 지키는 것은 상황을 보면서도 본질을 잃지 않는 것일 수 있습니다.", "이제 다른 사람의 평가가 달라져도 자신의 중심을 지킬 수 있고, 필요할 때는 방법을 바꾸면서도 중요하게 여기는 방향은 계속 걸어가실 수 있습니다."], ["당신은 사람들의 평가나 상황이 달라져도 내가 중요하게 여기는 방향에 대한 확신이 분명하게 유지된다고 응답하셨습니다.", "당신은 사람들의 반응과 자신이 중요하게 여기는 것을 구별할 수 있습니다. 상황이 어려워져도 모든 것을 포기하지 않고, 필요하면 방법을 바꾸면서도 자신이 중요하게 여기는 본질은 붙들 수 있습니다.", "이제 자신의 길을 증명하기 위해 사람들의 동의를 얻어야 할 필요도 줄어듭니다. 사람들의 박수보다 하나님 앞에서 무엇을 따라 살아갈 것인가가 더 분명하기 때문입니다.", "그래서 결과가 달라져도 방향을 잃지 않을 수 있고, 상황에 따라 멈추거나 기다리거나 다른 방법을 선택하면서도 중심은 지킬 수 있습니다.", "방법은 달라질 수 있지만, 하나님 앞에서 중요하게 여기는 본질까지 매번 바꿀 필요는 없습니다. 그 중심을 붙들고 자신의 길을 충분히 걸어가고 계십니다."]], "head": "사람들의 평가와 상황이 달라져도"}]}]}</script>
<script>(function () {
  'use strict';

  var API_URL = 'https://script.google.com/macros/s/AKfycbwDpZN9SXd2kuzSlrbcr45y27fp2CJXFcGxUG88-z3WuINkX6XWNNZ3iNvWUv5qZh33Og/exec';
  var DEMO = false;

  var DATA = JSON.parse(document.getElementById('data').textContent);
  var STAGES = DATA.stages;
  var app = document.getElementById('app');
  var CIRC = ['\u2460', '\u2461', '\u2462', '\u2463'];
  var NUMW = ['', '한', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉', '열', '열한', '열두'];
  var LS = 'mobius-selfcheck-v4-';

  var state = {
    view: 'login',        // login | intro | quiz | result
    code: '',             // normalized access code (10 chars)
    num: '',
    name: '',
    nameKnown: false,
    a: {},
    stage: 0,
    result: null,
    busy: false,
    loginMsg: '',
    introMsg: '',
    copyText: '',
    copyMsg: ''
  };

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function normCode(raw) {
    var c = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    return /^\d{2}[A-Z0-9]{8}$/.test(c) ? c : '';
  }
  function lsGet(code) { try { var s = localStorage.getItem(LS + code); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function lsSet() { if (!state.code) return; try { localStorage.setItem(LS + state.code, JSON.stringify({ a: state.a, stage: state.stage })); } catch (e) {} }

  function itemKeys(s, i) {
    var it = STAGES[s].items[i];
    if (it.parts) return it.parts.map(function (_, p) { return s + '.' + i + '.' + p; });
    return [s + '.' + i];
  }
  function stageKeys(s) {
    var out = [];
    STAGES[s].items.forEach(function (_, i) { out = out.concat(itemKeys(s, i)); });
    return out;
  }
  function stageDone(s) { return stageKeys(s).every(function (k) { return !!state.a[k]; }); }
  function countAnswered() {
    var n = 0;
    STAGES.forEach(function (_, s) { stageKeys(s).forEach(function (k) { if (state.a[k]) n++; }); });
    return n;
  }
  function firstIncompleteStage() {
    for (var s = 0; s < STAGES.length; s++) if (!stageDone(s)) return s;
    return STAGES.length - 1;
  }
  function el(id) { return document.getElementById(id); }
  function setText(id, t) { var e = el(id); if (e) e.textContent = t; }

  /* ---------- backend ---------- */
  var Backend;
  if (DEMO) {
    var demoDb = {};
    var demoScore = function (answers) {
      return STAGES.map(function (_, s) {
        var sum = 0, items = STAGES[s].items;
        items.forEach(function (it, i) {
          var ks = itemKeys(s, i), m = 0;
          ks.forEach(function (k) { m += answers[k]; });
          sum += m / ks.length;
        });
        var mean = sum / items.length;
        return mean < 1.5 ? 1 : (mean < 2.5 ? 2 : (mean < 3.5 ? 3 : 4));
      });
    };
    var demoResult = function (levels) {
      return { stages: STAGES.map(function (st, s) {
        return { label: st.qTitle, level: levels[s] };
      }) };
    };
    var wait = function (v) { return new Promise(function (r) { setTimeout(function () { r(v); }, 350); }); };
    Backend = {
      login: function (code) {
        if (!/^0[1-9]DEMOTEST$/.test(code)) return wait({ ok: false, error: 'invalid' });
        var u = demoDb[code] || (demoDb[code] = { name: '', status: '미시작', answers: {}, stage: 0, levels: null });
        return wait({ ok: true, name: u.name, status: u.status, answers: u.answers, stage: u.stage,
          result: u.status === '완료' ? demoResult(u.levels) : null });
      },
      save: function (code, answers, stage, name) {
        var u = demoDb[code]; if (!u) return wait({ ok: false, error: 'invalid' });
        if (u.status === '완료') return wait({ ok: false, error: 'locked' });
        u.answers = JSON.parse(JSON.stringify(answers)); u.stage = stage; u.status = '진행중';
        if (!u.name && name) u.name = name;
        return wait({ ok: true });
      },
      submit: function (code, answers, name) {
        var u = demoDb[code]; if (!u) return wait({ ok: false, error: 'invalid' });
        if (u.status === '완료') return wait({ ok: false, error: 'locked' });
        var missing = false;
        STAGES.forEach(function (_, s) { stageKeys(s).forEach(function (k) { if (!answers[k]) missing = true; }); });
        if (missing) return wait({ ok: false, error: 'incomplete' });
        u.answers = JSON.parse(JSON.stringify(answers)); u.levels = demoScore(answers); u.status = '완료';
        if (!u.name && name) u.name = name;
        return wait({ ok: true, result: demoResult(u.levels) });
      }
    };
  } else {
    var post = function (payload) {
      if (!API_URL) return Promise.resolve({ ok: false, error: 'noconfig' });
      var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = ctl ? setTimeout(function () { ctl.abort(); }, 45000) : null;
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow',
        signal: ctl ? ctl.signal : undefined
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (timer) clearTimeout(timer);
        return j;
      }, function () {
        if (timer) clearTimeout(timer);
        return { ok: false, error: 'network' };
      });
    };
    Backend = {
      login: function (code) { return post({ action: 'login', code: code }); },
      save: function (code, answers, stage, name) { return post({ action: 'save', code: code, answers: answers, stage: stage, name: name }); },
      submit: function (code, answers, name) { return post({ action: 'submit', code: code, answers: answers, name: name }); }
    };
  }

  /* ---------- figure-eight path with one node per stage ---------- */
  function lemn(states, decor, label) {
    var a = 150, n = STAGES.length, base = Math.PI / 2 + 0.3, r = 15, i;
    var d = '';
    for (i = 0; i <= 240; i++) {
      var t = i / 240 * 2 * Math.PI, s = Math.sin(t), c = Math.cos(t), q = 1 + s * s;
      d += (i ? 'L' : 'M') + (a * c / q).toFixed(1) + ' ' + (a * s * c / q).toFixed(1);
    }
    var svg = '<svg class="lem" viewBox="-176 -76 352 152" ' +
      (decor ? 'aria-hidden="true"' : 'role="img" aria-label="' + esc(label || '') + '"') + '>' +
      '<path d="' + d + '"/>';
    for (i = 0; i < n; i++) {
      var tt = base + i * 2 * Math.PI / n, ss = Math.sin(tt), cc = Math.cos(tt), qq = 1 + ss * ss;
      var x = a * cc / qq, y = a * ss * cc / qq;
      svg += '<g class="node ' + (states[i] || 'todo') + '" transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')">' +
        '<title>' + esc(STAGES[i].label) + '</title><circle r="' + r + '"/>' +
        '<text text-anchor="middle" dy="0.35em">' + STAGES[i].letter + '</text></g>';
    }
    return svg + '</svg>';
  }
  function fill(v) { var o = []; for (var i = 0; i < STAGES.length; i++) o.push(v); return o; }

  /* ---------- text rendering ---------- */
  function paras(arr) {
    return (arr || []).map(function (p) {
      return /^[\u201c\u2018].*[\u201d\u2019]$/.test(p) ? '<p class="say">' + esc(p) + '</p>' : '<p>' + esc(p) + '</p>';
    }).join('');
  }
  /* 문항마다 내가 고른 답과 그에 해당하는 해설을 보여 줍니다 */
  function fbBody(s) {
    var h = '';
    STAGES[s].items.forEach(function (it, i) {
      var v = Number(state.a[s + '.' + i]) || 0;
      if (v < 1 || v > 4 || !it.fb) return;
      h += '<section class="fbq">' +
        (it.head ? '<h4>' + esc(it.head) + '</h4>' : '<h4>' + (i + 1) + '번 문항</h4>') +
        '<p class="fbstem">' + esc(it.stem) + '</p>' +
        '<p class="myans"><span class="mylab">나의 응답</span><span class="mark" aria-hidden="true">' + CIRC[v - 1] + '</span> ' + esc(it.opts[v - 1]) + '</p>' +
        (it.st && it.st[v - 1] ? '<p class="fbst">' + esc(it.st[v - 1]) + '</p>' : '') +
        paras(it.fb[v - 1]) + '</section>';
    });
    return h;
  }
  function demoBar() {
    return DEMO ? '<p class="demo">체험용 화면입니다. 실제로 저장되지 않으며, 접속번호는 01-DEMO-TEST 입니다.</p>' : '';
  }
  function fmtNum() { return state.num ? state.num + '번' : ''; }

  /* ---------- views ---------- */
  function viewLogin() {
    var h = '<main class="wrap">' + demoBar() + '<header class="hero">' + lemn(fill('todo'), true) +
      '<h1 id="focus" tabindex="-1">뫼비우스 반전 자기점검</h1>' +
      '<p class="lede">' + NUMW[STAGES.length] + ' 개의 단계를 차례로 지나며 지금의 나를 살펴봅니다. 받으신 접속번호를 입력하면 시작합니다.</p></header>';
    h += '<section class="card"><div class="codebox"><label for="code-in">접속번호</label>' +
      '<div class="row"><input id="code-in" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="예: 07-K3F9-M2QX">' +
      '<button type="button" class="btn" data-act="login">들어가기</button></div>' +
      '<p class="msg" id="login-msg" role="status" aria-live="polite">' + esc(state.loginMsg) + '</p></div>' +
      '<p class="small">입력한 답은 세미나 운영자가 볼 수 있도록 저장됩니다. 중간에 멈추어도 같은 접속번호로 다시 들어오면 이어서 할 수 있습니다.</p></section></main>';
    return h;
  }

  function viewIntro() {
    var n = countAnswered(), total = 0;
    STAGES.forEach(function (_, s) { total += stageKeys(s).length; });
    var h = '<main class="wrap">' + demoBar() + '<header class="hero">' + lemn(fill('todo'), true) +
      '<h1 id="focus" tabindex="-1">' + (state.name ? esc(state.name) + ' 님, 환영합니다' : '환영합니다') + '</h1>' +
      '<p class="lede">접속번호 ' + esc(state.num) + '번으로 들어오셨습니다. 각 문항에서 지금의 나에게 가장 가까운 하나를 고르십시오.</p></header>';
    h += '<section class="card">';
    if (!state.nameKnown) {
      h += '<label for="name-in">이름 또는 닉네임 (선택)</label><input id="name-in" type="text" autocomplete="off" value="' + esc(state.name) + '">';
    }
    if (n > 0) {
