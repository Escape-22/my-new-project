      h += '<p class="small">' + n + '개 문항의 답이 저장되어 있습니다.</p>' +
        '<button type="button" class="btn wide" data-act="resume">이어서 하기</button>' +
        '<button type="button" class="btn ghost wide" data-act="first">처음 단계부터 보기</button>';
    } else {
      h += '<button type="button" class="btn wide" data-act="begin">검사 시작</button>';
    }
    h += '<p class="msg" role="status" aria-live="polite">' + esc(state.introMsg) + '</p>' +
      '<button type="button" class="btn ghost wide" data-act="logout">다른 접속번호로 들어가기</button></section></main>';
    return h;
  }

  function optsHtml(name, key, opts) {
    var cur = state.a[key], h = '<div class="opts" role="radiogroup">';
    opts.forEach(function (o, k) {
      var v = k + 1;
      h += '<label class="opt' + (cur === v ? ' sel' : '') + '"><input type="radio" name="' + name + '" data-key="' + key + '" value="' + v + '"' + (cur === v ? ' checked' : '') + '>' +
        '<span class="mark" aria-hidden="true">' + CIRC[k] + '</span><span class="txt">' + esc(o) + '</span></label>';
    });
    return h + '</div>';
  }
  function itemHtml(s, i) {
    var it = STAGES[s].items[i];
    var h = '<section class="item" id="q-' + s + '-' + i + '"><div class="qhead"><span class="qn">' + (i + 1) + '</span><div>';
    if (it.sub) h += '<p class="qsub">' + esc(it.sub) + '</p>';
    h += '<p class="qstem">' + esc(it.stem) + '</p></div></div>';
    if (it.parts) {
      it.parts.forEach(function (p, pi) {
        var key = s + '.' + i + '.' + pi;
        h += '<div class="part" id="q-' + s + '-' + i + '-' + pi + '"><p class="qstem pstem"><span class="pl">' + esc(p.label) + '</span>' + esc(p.stem) + '</p>' +
          optsHtml('r' + key, key, p.opts) + '</div>';
      });
    } else {
      var key2 = s + '.' + i;
      h += optsHtml('r' + key2, key2, it.opts);
    }
    return h + '</section>';
  }

  function viewQuiz() {
    var s = state.stage, st = STAGES[s];
    var states = STAGES.map(function (_, i) { return i < s ? 'done' : (i === s ? 'now' : 'todo'); });
    var h = '<main class="wrap">' + demoBar() + '<div class="prog">' + lemn(states, false, STAGES.length + '단계 중 ' + (s + 1) + '단계') +
      '<p class="progtxt">' + (s + 1) + ' / ' + STAGES.length + '</p></div>';
    h += '<header class="stagehead"><h2 id="focus" tabindex="-1" class="sr-only">' + (s + 1) + '단계 질문</h2>';
    if (st.intro.length) h += '<div class="intro">' + st.intro.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
    h += '</header>';
    st.items.forEach(function (_, i) { h += itemHtml(s, i); });
    h += '<p id="err" class="err" role="alert"></p>';
    h += '<p class="savetxt" id="savetxt" role="status" aria-live="polite"></p>';
    h += '<nav class="nav"><button type="button" class="btn ghost" data-act="prev">' + (s === 0 ? '처음으로' : '이전') + '</button>' +
      '<button type="button" class="btn" data-act="next">' + (s === STAGES.length - 1 ? '결과 보기' : '다음') + '</button></nav></main>';
    return h;
  }

  function viewResult() {
    var rs = state.result.stages;
    var states = rs.map(function (r) { return 'l' + r.level; });
    var h = '<main class="wrap">' + demoBar() + '<header class="hero">' + lemn(states, false, '단계별 결과') +
      '<h1 id="focus" tabindex="-1">' + (state.name ? esc(state.name) + ' 님의 결과' : '검사 결과') + '</h1>' +
      '<p class="lede">' + NUMW[STAGES.length] + ' 개의 단계에서 지금 내가 서 있는 자리입니다. 짙게 채워질수록 뒤쪽 수준에 가깝습니다.</p></header>';
    rs.forEach(function (r, s) {
      var meter = '';
      for (var k = 1; k <= 4; k++) meter += '<i' + (k <= r.level ? ' class="on"' : '') + '></i>';
      h += '<article class="res" id="res-' + s + '"><div class="reshead"><span class="glyph" aria-hidden="true">' + STAGES[s].letter + '</span><div>' +
        '<h3>' + esc(STAGES[s].qTitle) + '</h3>' + (STAGES[s].note ? '<p class="snote">' + esc(STAGES[s].note) + '</p>' : '') + '</div></div>' +
        '<div class="meter" aria-hidden="true">' + meter + '</div>' +
        '<details class="body"><summary>해설 보기</summary>' + fbBody(s) + '</details></article>';
    });
    h += '<section class="card tools"><p class="small">이 결과는 지금 이 시점의 나를 살펴보는 도구이며, 진단이 아닙니다. 같은 접속번호로 다시 들어오면 이 결과를 다시 볼 수 있습니다.</p>' +
      '<button type="button" class="btn ghost wide" data-act="copy">결과 요약 복사</button>';
    if (state.copyText) {
      h += '<textarea id="copy-box" readonly rows="' + (STAGES.length + 2) + '">' + esc(state.copyText) + '</textarea><p class="msg">' + esc(state.copyMsg) + '</p>';
    }
    h += '<button type="button" class="btn ghost wide" data-act="logout">처음 화면으로</button></section></main>';
    return h;
  }

  /* ---------- render ---------- */
  function render(scrollTop) {
    var html = state.view === 'intro' ? viewIntro() : state.view === 'quiz' ? viewQuiz() : state.view === 'result' ? viewResult() : viewLogin();
    app.innerHTML = html;
    if (scrollTop) {
      try { window.scrollTo(0, 0); } catch (e) {}
      var f = el('focus');
      if (f && f.focus) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } }
    }
  }

  /* ---------- saving ---------- */
  var dirty = false, saveTimer = null, chain = Promise.resolve(true);
  function setSave(t) { setText('savetxt', t); }
  function scheduleSave() {
    dirty = true;
    clearTimeout(saveTimer);
    setSave('');
    saveTimer = setTimeout(flushSave, 1200);
  }
  function flushSave() {
    clearTimeout(saveTimer);
    if (!dirty || !state.code) return chain;
    dirty = false;
    var snapshot = JSON.parse(JSON.stringify(state.a)), stage = state.stage, name = state.name;
    chain = chain.then(function () {
      setSave('저장 중입니다.');
      return Backend.save(state.code, snapshot, stage, name).then(function (r) {
        if (r && r.ok) { setSave('저장되었습니다.'); return true; }
        dirty = true;
        setSave(r && r.error === 'locked' ? '이미 제출된 검사라서 더 저장하지 않습니다.' : '저장하지 못했습니다. 인터넷 연결을 확인해 주십시오. 답은 이 기기에 임시로 보관됩니다.');
        return false;
      });
    });
    return chain;
  }

  /* ---------- actions ---------- */
  function errText(code) {
    if (code === 'invalid') return '접속번호가 맞지 않습니다. 다시 확인해 주십시오.';
    if (code === 'network') return '서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주십시오.';
    if (code === 'noconfig') return '이 페이지에는 아직 서버 주소가 설정되지 않았습니다.';
    if (code === 'busy') return '지금 접속이 몰려 있습니다. 잠시 뒤에 다시 시도해 주십시오.';
    return '처리하지 못했습니다. 잠시 뒤에 다시 시도해 주십시오.';
  }
  function setBusy(b) {
    state.busy = b;
    var btns = app.querySelectorAll('.btn');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = b;
  }

  function doLogin() {
    if (state.busy) return;
    var inp = el('code-in');
    var code = normCode(inp ? inp.value : '');
    if (!code) { state.loginMsg = '접속번호 형식이 맞지 않습니다. 숫자 2자리와 문자 8자리를 입력하십시오.'; setText('login-msg', state.loginMsg); return; }
    setBusy(true); setText('login-msg', '확인 중입니다. 잠시 기다려 주십시오.');
    Backend.login(code).then(function (res) {
      setBusy(false);
      if (!res || !res.ok) { state.loginMsg = errText(res && res.error); setText('login-msg', state.loginMsg); return; }
      state.code = code; state.num = code.slice(0, 2);
      state.name = res.name || ''; state.nameKnown = !!res.name;
      state.a = res.answers || {};
      var bk = lsGet(code);
      if (bk && bk.a) { Object.keys(bk.a).forEach(function (k) { if (!state.a[k]) { state.a[k] = bk.a[k]; dirty = true; } }); }
      state.stage = Math.min(res.stage || 0, STAGES.length - 1);
      state.loginMsg = '';
      if (res.status === '완료' && res.result) { state.result = res.result; state.view = 'result'; state.copyText = ''; }
      else { state.view = 'intro'; }
      render(true);
    });
  }

  function summaryText() {
    var lines = ['뫼비우스 반전 자기점검' + (state.name ? ' (' + state.name + ')' : '')];
    STAGES.forEach(function (st, s) {
      var picks = st.items.map(function (_, i) { var v = Number(state.a[s + '.' + i]) || 0; return v ? CIRC[v - 1] : '-'; });
      lines.push(st.qTitle + ' : ' + picks.join(' '));
    });
    return lines.join('\n');
  }
  function firstMissing() {
    var ks = stageKeys(state.stage);
    for (var i = 0; i < ks.length; i++) if (!state.a[ks[i]]) return ks[i];
    return null;
  }
  function elForKey(k) {
    var p = k.split('.');
    return el('q-' + p[0] + '-' + p[1] + (p.length > 2 ? '-' + p[2] : ''));
  }
  function label(k) {
    var p = k.split('.'), it = STAGES[+p[0]].items[+p[1]];
    return p.length > 2 ? it.parts[+p[2]].label : String(+p[1] + 1);
  }
  function captureName() { var n = el('name-in'); if (n) state.name = n.value.trim(); }

  function act(name) {
    if (name === 'login') { doLogin(); }
    else if (name === 'begin' || name === 'first') {
      captureName(); state.stage = 0; state.view = 'quiz'; dirty = true; render(true); scheduleSave();
    } else if (name === 'resume') {
      captureName(); state.stage = firstIncompleteStage(); state.view = 'quiz'; render(true);
    } else if (name === 'logout') {
      flushSave();
      state.view = 'login'; state.code = ''; state.num = ''; state.a = {}; state.name = ''; state.result = null; state.loginMsg = ''; state.copyText = ''; render(true);
    } else if (name === 'prev') {
      if (state.stage === 0) { state.view = 'intro'; } else { state.stage--; }
      lsSet(); dirty = true; render(true); scheduleSave();
    } else if (name === 'next') {
      var miss = firstMissing();
      if (miss) {
        setText('err', label(miss) + '번 문항에 아직 답하지 않았습니다. 답을 고른 뒤 다음으로 넘어가십시오.');
        var e = elForKey(miss);
        if (e) { e.classList.add('missing'); try { e.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (x) {} }
        return;
      }
      if (state.stage === STAGES.length - 1) { submitAll(); return; }
      state.stage++; lsSet(); dirty = true; render(true); scheduleSave();
    } else if (name === 'copy') {
      state.copyText = summaryText(); state.copyMsg = '';
      render(false);
      var box = el('copy-box'), done = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(state.copyText).then(function () {
            state.copyMsg = '복사했습니다.'; var m = document.querySelector('.tools .msg'); if (m) m.textContent = state.copyMsg;
          }, function () {
            state.copyMsg = '위 내용을 길게 눌러 복사하십시오.'; var m = document.querySelector('.tools .msg'); if (m) m.textContent = state.copyMsg;
          });
          done = true;
        }
      } catch (x) {}
      if (!done) { state.copyMsg = '위 내용을 길게 눌러 복사하십시오.'; var m2 = document.querySelector('.tools .msg'); if (m2) m2.textContent = state.copyMsg; }
      if (box && box.select) { try { box.focus(); box.select(); } catch (x) {} }
    }
  }

  function submitAll() {
    if (state.busy) return;
    setBusy(true); setText('err', ''); setSave('제출하는 중입니다. 잠시 기다려 주십시오.');
    clearTimeout(saveTimer); dirty = false;
    lsSet();
    Backend.submit(state.code, state.a, state.name).then(function (res) {
      setBusy(false);
      if (res && res.ok && res.result) {
        state.result = res.result; state.view = 'result'; state.copyText = ''; dirty = false; render(true);
      } else {
        setSave('');
        setText('err', res && res.error === 'incomplete' ? '답하지 않은 문항이 있습니다. 앞 단계를 확인해 주십시오.' : errText(res && res.error));
      }
    }).catch(function () {
      setBusy(false); setSave('');
      setText('err', '제출 중 오류가 발생했습니다. 다시 시도해 주십시오.');
    });
  }

  app.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== app && !(t.getAttribute && t.getAttribute('data-act'))) t = t.parentNode;
    if (t && t !== app && !t.disabled) act(t.getAttribute('data-act'));
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.type === 'radio' && t.getAttribute('data-key')) {
      var key = t.getAttribute('data-key');
      state.a[key] = parseInt(t.value, 10);
      var group = app.querySelectorAll('input[name="' + t.name + '"]');
      for (var i = 0; i < group.length; i++) {
        var lab = group[i].parentNode;
        if (group[i].checked) lab.classList.add('sel'); else lab.classList.remove('sel');
      }
      var blk = elForKey(key); if (blk) blk.classList.remove('missing');
      setText('err', '');
      lsSet(); scheduleSave();
    }
  });
  app.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'name-in') state.name = e.target.value;
  });
  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'code-in') { e.preventDefault(); doLogin(); }
  });
  window.addEventListener('pagehide', function () { if (dirty && state.view === 'quiz') { lsSet(); } });

  render(false);
})();
</script>
</body>
</html>
